<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#8da28a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>RenoPath — maquette</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%23C8F03C%27/%3E%3Cpath d=%27M9 24c9-1 14-8 15-16-9 1-15 7-15 16z%27 fill=%27%2314210F%27/%3E%3C/svg%3E" />
  <style>
    :root {
      --teal-950: #0E2F31;
      --teal-900: #164E50;
      --teal-800: #1A5C5A;
      --teal-700: #21776A;
      --teal-600: #25887A;
      --lime: #88DE7B;
      --lime-soft: #CEF1C9;
      --lime-wash: #E8F8E4;
      --ink: #181818;
      --muted: #595959;
      --faint: #7F7F7F;
      --line: #E2E8E5;
      --line-strong: #C9D4D0;
      --bg: #F3F5F4;
      --card: #FFFFFF;
      --warn: #B45309;
      --warn-bg: #FEF3C7;
      --danger: #B42318;
      --danger-bg: #FEE4E2;
      --ok: #16794A;
      --ok-bg: #E4F6EC;
      --info-bg: #E6F3F1;
      --banner-bg: #F6E7B8;
      --banner-ink: #5C4A12;
      --banner-line: #E2C56A;
      --shadow: 0 1px 2px rgba(16, 40, 36, .06), 0 8px 24px rgba(16, 40, 36, .05);
      --radius: 14px;
      --sidebar: 232px;
      --banner-h: 36px;
      --topbar-h: 56px;
      --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: var(--sans);
      color: var(--ink);
      background: var(--bg);
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    button, input, select { font-family: inherit; font-size: inherit; }
    button { cursor: pointer; }
    a { color: var(--teal-700); }
    .app { min-height: 100%; display: flex; }
    .sidebar {
      width: var(--sidebar);
      flex: 0 0 var(--sidebar);
      background: var(--teal-900);
      color: #fff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
    }
    .brand {
      display: flex; align-items: center; gap: 10px;
      padding: 20px 18px 16px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .brand-mark {
      width: 32px; height: 32px; border-radius: 9px;
      background: var(--lime);
      display: grid; place-items: center;
      flex: 0 0 32px;
    }
    .brand-mark svg { width: 18px; height: 18px; }
    .brand-name { font-weight: 700; font-size: 16px; letter-spacing: -.02em; line-height: 1.1; }
    .brand-name span { color: var(--lime); }
    .brand-sub { font-size: 11px; color: rgba(255,255,255,.62); margin-top: 1px; }
    .nav { padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
    .nav-label {
      font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
      color: rgba(255,255,255,.45); padding: 10px 10px 6px; font-weight: 600;
    }
    .nav-btn {
      display: flex; align-items: center; gap: 10px;
      border: 0; background: transparent; color: rgba(255,255,255,.86);
      text-align: left; padding: 9px 10px; border-radius: 9px; width: 100%;
      font-weight: 550;
    }
    .nav-btn svg { width: 18px; height: 18px; flex: 0 0 18px; opacity: .9; }
    .nav-btn:hover { background: rgba(255,255,255,.08); }
    .nav-btn.active { background: rgba(136,222,123,.18); color: #fff; }
    .nav-btn.active svg { opacity: 1; color: var(--lime); }
    .nav-mod {
      margin-left: auto; font-size: 10px; font-weight: 700;
      letter-spacing: .04em; color: rgba(255,255,255,.45);
      font-variant-numeric: tabular-nums;
    }
    .nav-btn.active .nav-mod { color: var(--lime); }
    .nav-building {
      margin: 0 10px 12px; padding: 10px 10px;
      background: rgba(0,0,0,.18); border-radius: 10px;
      border: 1px solid rgba(255,255,255,.06);
    }
    .nav-building .nb-k { font-size: 10px; color: rgba(255,255,255,.5); }
    .nav-building .nb-v { font-size: 12px; font-weight: 600; margin-top: 2px; color: #fff; }
    .sidebar-foot { padding: 12px 16px 16px; border-top: 1px solid rgba(255,255,255,.08); }
    .lang-toggle {
      display: flex; background: rgba(0,0,0,.22); border-radius: 999px; padding: 3px;
    }
    .lang-toggle button {
      flex: 1; border: 0; background: transparent; color: rgba(255,255,255,.7);
      border-radius: 999px; padding: 6px 0; font-weight: 700; font-size: 12px;
    }
    .lang-toggle button.on { background: var(--lime); color: var(--teal-950); }
    .workspace { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 100vh; }
    .banner {
      position: sticky; top: 0; z-index: 40;
      height: var(--banner-h);
      background: var(--banner-bg); color: var(--banner-ink);
      border-bottom: 1px solid var(--banner-line);
      display: flex; align-items: center; justify-content: center; gap: 8px;
      font-size: 12px; font-weight: 650; letter-spacing: .01em;
    }
    .banner .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
    .topbar {
      height: var(--topbar-h);
      display: flex; align-items: center; gap: 12px;
      padding: 0 22px;
      background: var(--card);
      border-bottom: 1px solid var(--line);
      position: sticky; top: var(--banner-h); z-index: 30;
    }
    .menu-btn {
      display: none; width: 36px; height: 36px; border: 1px solid var(--line);
      background: #fff; border-radius: 8px; align-items: center; justify-content: center;
    }
    .crumbs { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .crumbs b { color: var(--ink); font-weight: 650; }
    .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
    .search {
      display: flex; align-items: center; gap: 6px;
      background: var(--bg); border: 1px solid var(--line); border-radius: 9px;
      padding: 0 10px; height: 34px; width: 260px;
    }
    .search input {
      border: 0; background: transparent; outline: none; width: 100%; color: var(--ink);
    }
    .search svg, .ico { width: 18px; height: 18px; }
    .search svg { width: 15px; height: 15px; color: var(--faint); flex: 0 0 15px; }
    .upload .ico, .upload svg { width: 36px !important; height: 36px !important; display: block; margin: 0 auto 6px; color: var(--teal-700); }
    .notice svg { width: 22px !important; height: 22px !important; flex: 0 0 22px; margin-top: 1px; }
    .doc .di svg { width: 18px !important; height: 18px !important; }
    .peb-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 14px; align-items: start; }
    .toolbar .btn.primary { margin-left: auto; }
    .userpill { display: flex; align-items: center; gap: 8px; }
    .avatar {
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--teal-700); color: #fff; display: grid; place-items: center;
      font-weight: 700; font-size: 11px;
    }
    .userpill .un { font-weight: 650; font-size: 12px; line-height: 1.2; }
    .userpill .ur { font-size: 11px; color: var(--faint); }
    main { padding: 22px 24px 48px; flex: 1; }
    h1 { font-size: 22px; letter-spacing: -.03em; margin: 0 0 4px; font-weight: 750; }
    .lede { color: var(--muted); margin: 0 0 18px; max-width: 720px; }
    .ex-tag {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 10px; font-weight: 700; letter-spacing: .02em;
      text-transform: uppercase; color: var(--banner-ink);
      background: var(--banner-bg); border: 1px solid var(--banner-line);
      border-radius: 999px; padding: 1px 7px; vertical-align: middle;
      white-space: nowrap;
    }
    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
    .kpi {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 14px 16px; box-shadow: var(--shadow);
    }
    .kpi .k { font-size: 11px; color: var(--muted); font-weight: 600; }
    .kpi .v { font-size: 26px; font-weight: 750; letter-spacing: -.03em; margin: 4px 0 2px;
      font-variant-numeric: tabular-nums; }
    .kpi .s { font-size: 11px; color: var(--faint); }
    .kpi.warn .v { color: var(--warn); }
    .kpi.danger .v { color: var(--danger); }
    .kpi.ok .v { color: var(--ok); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 12px; }
    .seg {
      display: flex; flex-wrap: wrap; gap: 0; background: var(--card);
      border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
    }
    .seg button {
      border: 0; background: transparent; padding: 7px 11px; color: var(--muted);
      font-weight: 600; font-size: 12px; border-right: 1px solid var(--line);
    }
    .seg button:last-child { border-right: 0; }
    .seg button.on { background: var(--teal-900); color: #fff; }
    .btn {
      border: 1px solid var(--line); background: #fff; color: var(--ink);
      border-radius: 10px; padding: 8px 13px; font-weight: 650; font-size: 13px;
      display: inline-flex; align-items: center; gap: 7px;
    }
    .btn:hover { border-color: var(--line-strong); background: #fafcfb; }
    .btn svg { width: 15px; height: 15px; }
    .btn.primary { background: var(--teal-700); border-color: var(--teal-700); color: #fff; }
    .btn.primary:hover { background: var(--teal-800); }
    .btn.ghost { background: transparent; }
    .btn.lime { background: var(--lime); border-color: #6dcc61; color: var(--teal-950); }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      box-shadow: var(--shadow); overflow: hidden;
    }
    .card-h { padding: 14px 16px 0; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .card-h h2 { font-size: 15px; margin: 0; letter-spacing: -.01em; }
    .card-b { padding: 14px 16px 16px; }
    table.list { width: 100%; border-collapse: collapse; }
    table.list th {
      text-align: left; font-size: 11px; letter-spacing: .04em; text-transform: uppercase;
      color: var(--faint); font-weight: 700; padding: 10px 12px; border-bottom: 1px solid var(--line);
      background: #f9faf9; white-space: nowrap;
    }
    table.list td {
      padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: middle;
      font-variant-numeric: tabular-nums;
    }
    table.list tr:last-child td { border-bottom: 0; }
    table.list tbody tr { cursor: pointer; }
    table.list tbody tr:hover { background: #f6faf8; }
    .bname { font-weight: 700; color: var(--ink); }
    .baddr { font-size: 12px; color: var(--faint); }
    .chip {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 26px; height: 26px; padding: 0 7px; border-radius: 7px;
      font-weight: 800; font-size: 12px; letter-spacing: .02em; color: #fff;
    }
    .chip.A { background: #007A3D; }
    .chip.B { background: #50A30A; }
    .chip.C { background: #C0C000; color: #1a1a00; }
    .chip.D { background: #F7E300; color: #3a3200; }
    .chip.E { background: #F5A000; }
    .chip.F { background: #E85D04; }
    .chip.G { background: #D0001F; }
    .reg {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 12px; font-weight: 650; color: var(--teal-800);
    }
    .reg i { width: 7px; height: 7px; border-radius: 50%; background: var(--teal-700); display: inline-block; }
    .reg.wal { color: #6B4F1D; }
    .reg.wal i { background: #C9842A; }
    .st {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px;
      white-space: nowrap;
    }
    .st.at_risk { background: var(--danger-bg); color: var(--danger); }
    .st.in_progress { background: #E8EEFE; color: #3730A3; }
    .st.planned { background: var(--warn-bg); color: var(--warn); }
    .st.compliant { background: var(--ok-bg); color: var(--ok); }
    .st.indicative { background: var(--info-bg); color: var(--teal-700); }
    .st.review { background: #F3F4F6; color: #3F3F46; }
    .cdown { font-weight: 650; }
    .cdown.ok { color: var(--ok); }
    .cdown.warn { color: var(--warn); }
    .cdown.mute { color: var(--faint); font-weight: 550; }
    .empty { padding: 28px; text-align: center; color: var(--muted); }
    .grid-2 { display: grid; grid-template-columns: 1.3fr .7fr; gap: 14px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .upload {
      border: 1.5px dashed var(--line-strong); border-radius: 12px;
      background: #f8fbf9; padding: 18px 16px; text-align: center; color: var(--muted);
      transition: border-color .15s, background .15s;
    }
    .upload.drag { border-color: var(--teal-700); background: var(--lime-wash); }
    .upload.compact { display: flex; align-items: center; gap: 14px; text-align: left; padding: 12px 14px; }
    .upload.compact .ico, .upload.compact svg { width: 22px !important; height: 22px !important; margin: 0; flex: 0 0 22px; }
    .upload.compact .up-copy { flex: 1; min-width: 0; }
    .upload.compact h3 { margin: 0 0 2px; font-size: 14px; }
    .upload.compact p { margin: 0; font-size: 12.5px; }

    .upload h3 { margin: 8px 0 4px; color: var(--ink); font-size: 15px; }
    .rule {
      background: var(--info-bg); border: 1px solid #cfe3df; border-radius: 12px; padding: 14px 16px;
    }
    .rule h3 { margin: 0 0 8px; font-size: 14px; }
    .rule .why { margin: 0; color: var(--muted); }
    .rule dl { display: grid; grid-template-columns: 140px 1fr; gap: 6px 12px; margin: 10px 0 0; }
    .rule dt { color: var(--faint); font-size: 12px; }
    .rule dd { margin: 0; font-weight: 650; }
    .notice {
      border-radius: 12px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start;
      font-size: 13px;
    }
    .notice.alert { background: var(--danger-bg); color: #7A1A14; border: 1px solid #f5c2be; }
    .notice.warn { background: var(--warn-bg); color: #7A3E08; border: 1px solid #f3d48a; }
    .notice.info { background: var(--info-bg); color: #134E4A; border: 1px solid #cfe3df; }
    .notice strong { display: block; margin-bottom: 2px; }
    .stage { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; overflow: hidden; background: #fff; }
    .stage.done { border-color: #c9e8d4; }
    .stage-h {
      display: grid; grid-template-columns: 36px 1fr auto auto auto;
      gap: 10px; align-items: center; padding: 12px 14px; cursor: pointer;
    }
    .stage-n {
      width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
      background: var(--teal-900); color: #fff; font-weight: 800; font-size: 12px;
    }
    .stage.done .stage-n { background: var(--ok); }
    .stage.suspended-grant .grant { color: var(--danger); text-decoration: line-through; }
    .stage .ttl { font-weight: 700; }
    .stage .meta { font-size: 12px; color: var(--faint); }
    .money { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
    .grant { font-size: 12px; text-align: right; font-weight: 650; color: var(--ok); }
    .stage-b { display: none; padding: 0 14px 14px 60px; color: var(--muted); font-size: 13px; }
    .stage.open .stage-b { display: block; }
    .totals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 8px; }
    .tot { background: var(--bg); border-radius: 12px; padding: 12px 14px; }
    .tot .k { font-size: 11px; color: var(--muted); font-weight: 600; }
    .tot .v { font-size: 20px; font-weight: 750; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .docs { display: flex; flex-direction: column; gap: 8px; }
    .doc {
      display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; align-items: center;
      border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: #fff;
    }
    .doc .di {
      width: 36px; height: 36px; border-radius: 8px; background: var(--lime-wash);
      display: grid; place-items: center; color: var(--teal-800);
    }
    .doc .dt { font-weight: 700; }
    .doc .ds { font-size: 12px; color: var(--faint); }
    .badge {
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em;
      padding: 2px 7px; border-radius: 999px; background: var(--lime-wash); color: var(--teal-800);
    }
    .badge.queue { background: var(--warn-bg); color: var(--warn); }
    .badge.missing { background: var(--danger-bg); color: var(--danger); }
    .check { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .check:last-child { border-bottom: 0; }
    .check input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--teal-700); }
    .check.done .ct { text-decoration: line-through; color: var(--faint); }
    .progress { height: 8px; background: #e6ecea; border-radius: 99px; overflow: hidden; }
    .progress > span { display: block; height: 100%; background: linear-gradient(90deg, var(--teal-700), var(--lime)); }
    .log { font-family: var(--mono); font-size: 11.5px; line-height: 1.55; }
    .log-row { display: grid; grid-template-columns: 52px 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
    .log-row:last-child { border-bottom: 0; }
    .log .idx { color: var(--teal-700); font-weight: 700; }
    .log .hash { color: #0F3D3A; word-break: break-all; }
    .log .prev { color: var(--faint); }
    .log .act { font-family: var(--sans); font-size: 12.5px; font-weight: 650; margin-bottom: 2px; color: var(--ink); }
    .log .when { font-family: var(--sans); color: var(--faint); font-size: 12px; }
    .remind { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; padding: 14px 0; border-bottom: 1px solid var(--line); }
    .remind:last-child { border-bottom: 0; }
    .remind.done { opacity: .55; }
    .remind.done .rt { text-decoration: line-through; }
    .rt { font-weight: 700; }
    .rm { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .racts { display: flex; gap: 6px; align-items: flex-start; }
    .toast-wrap {
      position: fixed; right: 18px; bottom: 18px; z-index: 80;
      display: flex; flex-direction: column; gap: 8px;
    }
    .toast {
      background: var(--teal-950); color: #fff; padding: 10px 14px; border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,.2); max-width: 360px; font-size: 13px;
    }
    .modal-back {
      position: fixed; inset: 0; background: rgba(14,47,49,.45); z-index: 70;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .modal {
      background: #fff; border-radius: 16px; width: min(520px, 100%);
      padding: 20px 22px; box-shadow: 0 20px 50px rgba(0,0,0,.2);
    }
    .modal h3 { margin: 0 0 8px; font-size: 17px; }
    .share-box {
      background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
      padding: 10px 12px; font-family: var(--mono); font-size: 12px; word-break: break-all; margin: 10px 0;
    }
    .scrim {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 45;
    }
    .metric-row { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; font-size: 13px; }
    .metric-row + .metric-row { border-top: 1px solid var(--line); }
    .muted { color: var(--muted); }
    .faint { color: var(--faint); }
    .right { text-align: right; }
    .nowrap { white-space: nowrap; }
    .hidden { display: none !important; }
    .icon-btn { border: 0; background: transparent; padding: 4px; color: var(--muted); }
    h2.sec { font-size: 15px; margin: 18px 0 8px; }
    .peb-big { display: flex; align-items: center; gap: 14px; }
    .peb-big .chip { width: 56px; height: 56px; font-size: 26px; border-radius: 12px; min-width: 56px; }
    .peb-big .kwh { font-size: 28px; font-weight: 750; letter-spacing: -.03em; line-height: 1; }
    .peb-big .unit { font-size: 12px; color: var(--faint); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    .fine-note { font-size: 12px; color: var(--muted); margin-top: 8px; }

    /* —— v2 visual dashboard & touch-friendly UI —— */
    .nav-btn { min-height: 44px; padding: 10px 12px; }
    .btn { min-height: 44px; padding: 10px 16px; }
    .menu-btn { width: 44px; height: 44px; }
    .seg button { min-height: 40px; padding: 8px 14px; }
    .lang-toggle button { min-height: 36px; }
    .page-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
    .page-head h1 { margin-bottom: 0; }
    .page-head .lede { margin: 6px 0 0; }
    .kpi { position: relative; }
    .kpi .v { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .kpi .delta { font-size: 12px; font-weight: 700; }
    .kpi .delta.up { color: var(--ok); }
    .kpi .delta.down { color: var(--danger); }
    .kpi .delta.flat { color: var(--faint); }
    .kpi .spark { display: block; margin-top: 8px; width: 100%; height: 28px; }
    .dash-row { display: grid; gap: 14px; margin-bottom: 14px; }
    .dash-row.kpis4 { grid-template-columns: repeat(4, 1fr); margin-bottom: 14px; }
    .dash-row.two { grid-template-columns: 1fr 1.4fr; }
    .dash-row.two-eq { grid-template-columns: 1fr 1fr; }
    .dash-row.three { grid-template-columns: 1.1fr 0.9fr 1.1fr; }
    .chart-card .card-h { align-items: center; }
    .chart-card h2 { font-size: 14px; }
    .chart-svg { width: 100%; height: auto; display: block; overflow: visible; }
    .chart-svg .hit { cursor: pointer; }
    .chart-legend { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 10px; font-size: 11px; color: var(--muted); }
    .chart-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
    .chart-legend button { border: 0; background: transparent; color: inherit; padding: 4px 0; min-height: 32px; cursor: pointer; font-weight: 600; }
    .chart-legend button:hover { color: var(--ink); }
    .chart-tip {
      position: fixed; z-index: 90; display: none;
      background: var(--teal-950); color: #fff; padding: 8px 10px; border-radius: 10px;
      font-size: 12px; line-height: 1.35; max-width: 260px; pointer-events: none;
      box-shadow: 0 8px 24px rgba(0,0,0,.22);
    }
    .chart-tip.on { display: block; }
    .chart-tip b { display: block; margin-bottom: 2px; }
    .attn-list { display: flex; flex-direction: column; gap: 8px; }
    .attn {
      display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; align-items: center;
      border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: #fff;
      text-align: left; width: 100%; color: inherit; min-height: 64px; cursor: pointer;
    }
    .attn:hover { border-color: var(--teal-700); box-shadow: var(--shadow); }
    .attn .at { font-weight: 700; font-size: 13px; }
    .attn .as { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .ring-wrap { display: flex; align-items: center; gap: 16px; }
    .ring-meta .big { font-size: 22px; font-weight: 750; letter-spacing: -.03em; }
    .bcards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .bcard {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 16px; text-align: left; color: inherit;
      width: 100%; cursor: pointer; min-height: 168px;
      display: flex; flex-direction: column; gap: 8px;
      transition: border-color .15s, box-shadow .15s, transform .15s;
    }
    .bcard:hover { border-color: var(--teal-700); box-shadow: 0 6px 20px rgba(16,40,36,.1); transform: translateY(-1px); }
    .bcard-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .bcard h3 { margin: 0; font-size: 15px; letter-spacing: -.02em; }
    .bcard-mid { display: flex; align-items: center; gap: 12px; margin-top: auto; }
    .bcard-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .peb-scale { width: 100%; }
    .kwh-gauge { width: 100%; }
    .gantt-scroller, .cal-scroller { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .wf-svg, .gantt-svg { width: 100%; min-width: 0; }
    .cal-svg { min-width: 520px; }
    .cal-day { fill: #fff; stroke: var(--line); }
    .cal-day.has { fill: var(--lime-wash); stroke: var(--teal-700); cursor: pointer; }
    .cal-day.today { stroke: var(--teal-900); stroke-width: 2; }
    .hatch { fill: url(#hatchSuspended); }
    .axis { font-size: 10px; fill: var(--faint); }
    .axis-title { font-size: 11px; fill: var(--muted); font-weight: 600; }
    .milestone { stroke: var(--danger); stroke-dasharray: 4 3; }
    .filter-chip {
      display: inline-flex; align-items: center; gap: 6px; min-height: 36px;
      border-radius: 999px; border: 1px solid var(--teal-700); background: var(--info-bg);
      color: var(--teal-900); font-weight: 700; font-size: 12px; padding: 0 12px; cursor: pointer;
    }
    .view-toggle .seg { margin-left: 0; }

    @media (max-width: 1200px) {
      .bcards { grid-template-columns: repeat(2, 1fr); }
      .dash-row.three { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 980px) {
      .dash-row.kpis4, .dash-row.two, .dash-row.two-eq, .dash-row.three { grid-template-columns: 1fr 1fr; }
      .kpis { grid-template-columns: repeat(2, 1fr); }
      .grid-2, .grid-3, .totals, .stage-h { grid-template-columns: 1fr; }
      .stage-h { display: flex; flex-wrap: wrap; }
      .search { width: 180px; }
      .sidebar {
        position: fixed; left: 0; top: 0; z-index: 50;
        transform: translateX(-105%); transition: transform .2s ease;
      }
      .sidebar.open { transform: none; }
      .menu-btn { display: inline-flex; }
      .scrim.on { display: block; }
    }
    @media (max-width: 768px) {
      main { padding: 16px 14px 40px; }
      .dash-row.kpis4, .dash-row.two, .dash-row.two-eq, .dash-row.three, .kpis, .bcards { grid-template-columns: 1fr; }
      .userpill .umeta { display: none; }
      .search { display: none; }
      .page-head { flex-direction: column; }
      h1 { font-size: 20px; }
    }
    @media (min-width: 981px) and (max-width: 1100px) {
      .search { width: 160px; }
    }

    /* =====================================================================
       v3 — "glass over map" theme
       Dark frosted-glass cards over a full-bleed aerial neighbourhood map,
       sage-green backdrop, lime accents. All imagery is inline SVG/CSS.
       ===================================================================== */
    :root {
      --lime: #C8F03C;
      --lime-ink: #14210F;
      --lime-soft: rgba(200,240,60,.18);
      --lime-wash: rgba(200,240,60,.10);
      --ink: #EEF3E9;
      --muted: rgba(238,243,233,.70);
      --faint: rgba(238,243,233,.50);
      --line: rgba(255,255,255,.09);
      --line-strong: rgba(255,255,255,.2);
      --bg: rgba(255,255,255,.06);
      --card: rgba(24,38,26,.62);
      --teal-950: #0B140D;
      --teal-900: #17261A;
      --teal-800: #D6F46A;
      --teal-700: #C8F03C;
      --teal-600: #A5DB2C;
      --warn: #FFD27A; --warn-bg: rgba(255,200,87,.14);
      --danger: #FF9C80; --danger-bg: rgba(255,122,89,.16);
      --ok: #6FE3A5; --ok-bg: rgba(79,208,138,.16);
      --info-bg: rgba(255,255,255,.07);
      --banner-bg: rgba(255,200,87,.15); --banner-ink: #FFE2A3; --banner-line: rgba(255,200,87,.32);
      --shadow: 0 18px 40px -20px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06);
      --radius: 22px;
      --sidebar: 216px;
      --banner-h: 34px;
      --topbar-h: 62px;
      --frame: 18px;
      --glass: linear-gradient(180deg, rgba(40,58,41,.58), rgba(21,33,23,.66));
      --glass-line: rgba(255,255,255,.09);
      --sans: ui-sans-serif, system-ui, -apple-system, "SF Pro Text", "Inter", "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    html { background: #7b9179; color-scheme: dark; }
    body {
      color: var(--ink);
      font-weight: 450;
      letter-spacing: -.005em;
      background:
        radial-gradient(1100px 600px at 16% -10%, rgba(255,255,255,.26), transparent 62%),
        linear-gradient(180deg, #95aa92 0%, #7d937a 52%, #6b8168 100%);
      background-attachment: fixed;
      min-height: 100%;
    }
    ::selection { background: var(--lime); color: var(--lime-ink); }
    a { color: var(--lime); }
    h1, h2, h3 { font-weight: 560; letter-spacing: -.02em; }

    /* device frame + full-bleed generated map */
    .stage-bg {
      position: fixed; inset: var(--frame); z-index: 0;
      border-radius: 36px; overflow: hidden; background: #0e170f;
      box-shadow: 0 0 0 6px #0b100d, 0 0 0 7px rgba(255,255,255,.05), 0 50px 80px -30px rgba(7,16,9,.7);
    }
    .stage-bg .map-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .stage-bg::after {
      content: ""; position: absolute; inset: 0;
      background:
        radial-gradient(120% 90% at 50% 30%, rgba(8,16,9,.22), rgba(6,12,7,.62) 100%),
        linear-gradient(180deg, rgba(9,17,10,.38), rgba(9,17,10,.62));
    }
    .app {
      position: fixed; inset: var(--frame); z-index: 1;
      display: flex; gap: 16px; padding: 16px;
      min-height: 0;
    }
    .workspace {
      flex: 1; min-width: 0; min-height: 0; height: 100%;
      overflow-y: auto; overflow-x: hidden;
      -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
      scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.22) transparent;
      padding: 0 6px 0 0;
    }
    .workspace::-webkit-scrollbar { width: 8px; }
    .workspace::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 8px; }
    main { padding: 18px 2px 36px; }

    /* floating glass nav */
    .sidebar {
      position: relative; top: auto; height: 100%; min-height: 0;
      flex: 0 0 var(--sidebar); width: var(--sidebar);
      background: var(--glass);
      -webkit-backdrop-filter: blur(26px) saturate(1.25); backdrop-filter: blur(26px) saturate(1.25);
      border: 1px solid var(--glass-line); border-radius: 28px;
      box-shadow: var(--shadow); color: var(--ink);
    }
    .brand { border-bottom: 0; padding: 20px 18px 8px; }
    .brand-mark { background: var(--lime); border-radius: 11px; width: 34px; height: 34px; flex-basis: 34px; box-shadow: 0 8px 20px -6px rgba(200,240,60,.5); }
    .brand-name { font-size: 21px; font-weight: 600; letter-spacing: -.03em; }
    .brand-name span { color: var(--lime); }
    .brand-sub { color: var(--faint); }
    .nav { padding: 10px 10px 6px; gap: 4px; }
    .nav-label { color: var(--faint); font-weight: 600; letter-spacing: .1em; padding: 14px 12px 6px; }
    .nav-btn { color: var(--muted); border-radius: 16px; min-height: 46px; padding: 10px 12px; font-weight: 500; font-size: 14px; transition: background .15s, color .15s; }
    .nav-btn svg { width: 20px; height: 20px; flex-basis: 20px; opacity: .85; }
    .nav-btn:hover { background: rgba(255,255,255,.07); color: #fff; }
    .nav-btn.active { background: rgba(255,255,255,.15); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.1); }
    .nav-btn.active svg { color: var(--lime); opacity: 1; }
    .nav-btn .nav-badge-dot { margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: var(--lime); }
    .nav-mod { color: var(--faint); }
    .nav-btn.active .nav-mod { color: var(--lime); }
    .nav-building {
      background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 18px; padding: 12px;
    }
    .nav-building .nb-k { color: var(--faint); }
    .nav-building .nb-v { font-weight: 600; }
    .sidebar-foot { border-top: 0; padding: 8px 14px 16px; }
    .lang-toggle { background: rgba(0,0,0,.28); border: 1px solid var(--line); }
    .lang-toggle button { color: var(--muted); }
    .lang-toggle button.on { background: var(--lime); color: var(--lime-ink); }

    /* header block: example banner + topbar */
    .banner {
      position: sticky; top: 0; z-index: 41;
      height: auto; min-height: var(--banner-h); padding: 6px 14px; text-align: center;
      background: linear-gradient(180deg, rgba(60,52,26,.72), rgba(40,36,20,.72));
      -webkit-backdrop-filter: blur(22px); backdrop-filter: blur(22px);
      border: 1px solid var(--banner-line); border-bottom: 0;
      border-radius: 22px 22px 0 0; color: var(--banner-ink);
      font-weight: 550; font-size: 12px;
    }
    .banner .dot { background: #FFC857; box-shadow: 0 0 0 4px rgba(255,200,87,.18); flex: 0 0 7px; }
    .topbar {
      position: sticky; top: var(--banner-h); z-index: 40;
      height: var(--topbar-h); padding: 0 14px 0 18px; gap: 12px;
      background: var(--glass);
      -webkit-backdrop-filter: blur(26px) saturate(1.25); backdrop-filter: blur(26px) saturate(1.25);
      border: 1px solid var(--glass-line); border-radius: 0 0 22px 22px;
      box-shadow: var(--shadow);
    }
    .menu-btn { background: rgba(255,255,255,.08); border: 1px solid var(--line); color: var(--ink); border-radius: 50%; }
    .crumbs { color: var(--muted); }
    .crumbs b { color: #fff; font-weight: 600; }
    .search {
      background: rgba(8,14,9,.5); border: 1px solid var(--line); border-radius: 999px;
      height: 44px; padding: 0 16px; width: 280px; gap: 8px;
    }
    .search input { color: var(--ink); }
    .search input::placeholder { color: var(--faint); }
    .search svg { color: var(--muted); width: 17px; height: 17px; flex-basis: 17px; }
    .bell-btn {
      position: relative; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
      background: rgba(255,255,255,.08); border: 1px solid var(--line); color: var(--ink);
    }
    .bell-btn svg { width: 19px; height: 19px; }
    .bell-btn .dot { position: absolute; top: 9px; right: 10px; width: 9px; height: 9px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 0 2px #1b2a1d; }
    .userpill { background: rgba(255,255,255,.08); border: 1px solid var(--line); border-radius: 999px; padding: 4px 16px 4px 4px; gap: 10px; }
    .avatar { width: 36px; height: 36px; background: radial-gradient(circle at 30% 25%, #E4FA7A, var(--lime)); color: var(--lime-ink); font-size: 12px; font-weight: 700; }
    .userpill { flex: 0 0 auto; white-space: nowrap; }
    .crumbs { flex: 1 1 auto; min-width: 0; }
    .userpill .un { color: #fff; font-weight: 600; }
    .userpill .ur { color: var(--faint); }

    /* type */
    h1 { font-size: 30px; font-weight: 520; letter-spacing: -.035em; line-height: 1.1; }
    .lede { color: var(--muted); font-size: 14.5px; }
    .faint, .baddr { color: var(--faint); }
    .muted { color: var(--muted); }
    .ex-tag { background: rgba(255,200,87,.12); color: #FFD98A; border: 1px solid rgba(255,200,87,.3); font-weight: 650; }

    /* glass surfaces */
    .card, .bcard {
      background: var(--glass);
      -webkit-backdrop-filter: blur(24px) saturate(1.2); backdrop-filter: blur(24px) saturate(1.2);
      border: 1px solid var(--glass-line); border-radius: 26px; box-shadow: var(--shadow);
      overflow: hidden; color: var(--ink);
    }
    .card-h { padding: 18px 20px 0; }
    .card-h h2 { font-size: 17px; font-weight: 520; letter-spacing: -.02em; }
    .card-b { padding: 14px 20px 20px; }
    .chart-card h2 { font-size: 17px; }
    .bcard { padding: 18px; min-height: 176px; }
    .bcard:hover { border-color: rgba(200,240,60,.5); box-shadow: 0 24px 50px -22px rgba(0,0,0,.7), 0 0 0 1px rgba(200,240,60,.25); transform: translateY(-2px); }
    .bcard h3 { font-size: 16px; font-weight: 560; }
    .kpi {
      background: rgba(255,255,255,.055); border: 1px solid var(--line); border-radius: 22px; box-shadow: none;
      padding: 16px 18px; color: var(--ink);
    }
    .kpi .k { color: var(--muted); font-weight: 500; font-size: 12.5px; }
    .kpi .v { font-size: 32px; font-weight: 450; letter-spacing: -.04em; color: #fff; }
    .kpi .s { color: var(--faint); }
    .kpi.warn .v { color: #FFD27A; }
    .kpi.danger .v { color: #FFA48A; }
    .kpi.ok .v { color: #fff; }
    .kpi .delta { font-size: 11.5px; font-weight: 650; padding: 3px 9px; border-radius: 999px; letter-spacing: 0; }
    .kpi .delta.up { color: var(--lime); background: rgba(200,240,60,.1); border: 1px solid rgba(200,240,60,.3); }
    .kpi .delta.down { color: #FF9C80; background: rgba(255,122,89,.1); border: 1px solid rgba(255,122,89,.3); }
    .kpi .delta.flat { color: var(--muted); background: rgba(255,255,255,.06); border: 1px solid var(--line); }
    .kpi .spark { height: 32px; }
    .tot { background: rgba(255,255,255,.055); border: 1px solid var(--line); border-radius: 18px; }
    .tot .k { color: var(--muted); }

    /* buttons, chips, segmented */
    .btn {
      background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); color: var(--ink);
      border-radius: 999px; min-height: 46px; padding: 10px 20px; font-weight: 600;
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      transition: background .15s, border-color .15s, transform .1s;
    }
    .btn:hover { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.26); }
    .btn:active { transform: scale(.985); }
    .btn.primary, .btn.lime {
      background: var(--lime); border-color: var(--lime); color: var(--lime-ink); font-weight: 700;
      box-shadow: 0 12px 28px -10px rgba(200,240,60,.55);
    }
    .btn.primary:hover, .btn.lime:hover { background: #D6F85A; border-color: #D6F85A; }
    .btn.ghost { background: transparent; }
    .seg {
      background: rgba(8,14,9,.45); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px;
      -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    }
    .seg button { color: var(--muted); border-right: 0; border-radius: 999px; font-weight: 600; padding: 8px 15px; }
    .seg button:hover { color: #fff; }
    .seg button.on { background: var(--lime); color: var(--lime-ink); }
    .seg button svg { vertical-align: -3px; margin-right: 6px; }
    .filter-chip { background: var(--lime-soft); border-color: rgba(200,240,60,.5); color: var(--lime); }
    .icon-btn { color: var(--muted); }
    .chip { color: #fff; border-radius: 9px; }
    .chip.C, .chip.D { color: #1a1a00; }
    .st { padding: 4px 10px; font-weight: 650; border: 1px solid transparent; }
    .st.at_risk { background: rgba(255,122,89,.16); color: #FFA48A; border-color: rgba(255,122,89,.3); }
    .st.in_progress { background: rgba(200,240,60,.12); color: var(--lime); border-color: rgba(200,240,60,.3); }
    .st.planned { background: rgba(255,200,87,.13); color: #FFD27A; border-color: rgba(255,200,87,.28); }
    .st.compliant { background: rgba(111,227,165,.14); color: #7FE8B0; border-color: rgba(111,227,165,.3); }
    .st.indicative { background: rgba(255,255,255,.07); color: var(--muted); border-color: var(--line); }
    .st.review { background: rgba(255,255,255,.1); color: #fff; border-color: rgba(255,255,255,.2); }
    .reg { color: #DDF58A; }
    .reg i { background: var(--lime); }
    .reg.wal { color: #F4CD8C; }
    .reg.wal i { background: #E8A94A; }
    .cdown.ok { color: #7FE8B0; }
    .cdown.warn { color: #FFD27A; }
    .cdown.mute { color: var(--faint); }
    .badge { background: var(--lime-soft); color: var(--lime); }
    .badge.queue { background: var(--warn-bg); color: var(--warn); }
    .badge.missing { background: var(--danger-bg); color: var(--danger); }

    /* tables & lists */
    table.list th { background: transparent; color: var(--faint); border-bottom: 1px solid var(--line); }
    table.list td { border-bottom: 1px solid var(--line); }
    table.list tbody tr:hover { background: rgba(255,255,255,.05); }
    .bname { color: #fff; font-weight: 600; }
    .metric-row + .metric-row { border-top-color: var(--line); }
    .stage { background: rgba(255,255,255,.05); border: 1px solid var(--line); border-radius: 20px; }
    .stage.done { border-color: rgba(111,227,165,.35); }
    .stage-n { background: rgba(255,255,255,.14); color: #fff; border-radius: 10px; }
    .stage.done .stage-n { background: var(--lime); color: var(--lime-ink); }
    .stage-b { color: var(--muted); }
    .grant { color: #7FE8B0; }
    .stage.suspended-grant .grant { color: #FF9C80; }
    .doc { background: rgba(255,255,255,.05); border: 1px solid var(--line); border-radius: 18px; }
    .doc .di { background: var(--lime-soft); color: var(--lime); border-radius: 12px; }
    .check { border-bottom-color: var(--line); }
    .check input { accent-color: var(--lime); }
    .progress { background: rgba(255,255,255,.1); }
    .progress > span { background: linear-gradient(90deg, #4FD1A5, var(--lime)); }
    .log .hash { color: #D8E6C9; }
    .log .idx { color: var(--lime); }
    .log .act { color: #fff; }
    .log-row { border-bottom-color: var(--line); }
    .remind { border-bottom-color: var(--line); }
    .rule { background: rgba(255,255,255,.055); border: 1px solid var(--line); border-radius: 20px; }
    .rule .why { color: var(--muted); }
    .rule dt { color: var(--faint); }
    .notice { border-radius: 18px; }
    .notice.alert { background: rgba(255,122,89,.13); color: #FFC3B3; border-color: rgba(255,122,89,.32); }

    /* ---------- map hero ---------- */
    .map-wrap { position: relative; margin-bottom: 16px; }
    .map-stage {

      box-shadow: 0 30px 60px -28px rgba(0,0,0,.7);
    }
    .map-stage .map-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .map-stage::before {
      content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
      background:
        linear-gradient(180deg, rgba(9,16,10,.55), rgba(9,16,10,.0) 26%, rgba(9,16,10,.0) 62%, rgba(9,16,10,.5)),
        radial-gradient(110% 100% at 50% 45%, rgba(0,0,0,0) 55%, rgba(4,9,5,.55) 100%),
        rgba(18,30,18,.34);

    .map-title {
      position: absolute; z-index: 3; left: 18px; bottom: 14px; display: flex; align-items: center; gap: 8px;

    }
    .map-title .scale { display: inline-block; width: 54px; height: 6px; border: 1.5px solid rgba(255,255,255,.7); border-top: 0; margin-right: 4px; }
    .map-chips {
      position: absolute; z-index: 4; top: 14px; left: 14px; right: 14px;
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    }
    .map-chip {
      min-height: 40px; padding: 0 18px; border-radius: 999px; font-weight: 600; font-size: 13.5px;
      background: rgba(12,20,13,.72); color: #fff; border: 1px solid rgba(255,255,255,.12);
      -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
      display: inline-flex; align-items: center; gap: 8px; transition: background .15s, color .15s;
    }
    .map-chip:hover { background: rgba(30,46,31,.85); }
    .map-chip.on { background: var(--lime); color: var(--lime-ink); border-color: var(--lime); box-shadow: 0 10px 24px -8px rgba(200,240,60,.55); }
    .map-chips .map-tag { margin-left: auto; }
    .parcel { position: absolute; z-index: 2; left: var(--xn); top: var(--y); width: 170px; height: 132px; transform: translate(-50%, -52%); pointer-events: none; overflow: visible; }
    .parcel polygon { fill: rgba(200,240,60,.16); stroke: var(--lime); stroke-width: 1.8; stroke-linejoin: round; }
    .pin {
      position: absolute; z-index: 3; left: var(--xn); top: var(--y);
      transform: translate(-50%, calc(-100% + 8px));
      display: flex; flex-direction: column; align-items: center;
      background: none; border: 0; padding: 0; color: #fff; cursor: pointer;
    }
    .pin-chip {
      display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 13px 0 11px; border-radius: 999px;
      background: rgba(12,20,13,.78); border: 1px solid rgba(255,255,255,.14); color: #fff; font-size: 12.5px; white-space: nowrap;
      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
      box-shadow: 0 8px 22px -8px rgba(0,0,0,.6); transition: background .15s, transform .15s;
    }
    .pin-chip .pdot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, #fff); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c, #fff) 25%, transparent); flex: 0 0 8px; }
    .pin-chip b { font-weight: 650; }
    .pin-chip em { font-style: normal; color: rgba(255,255,255,.66); display: inline-flex; align-items: center; gap: 5px; }
    .pin-chip .chip.mini { min-width: 18px; height: 18px; padding: 0 4px; font-size: 10.5px; border-radius: 5px; }
    .pin-stem { width: 1.5px; height: 9px; background: rgba(255,255,255,.7); }
    .pin-dot { width: 13px; height: 13px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px rgba(255,255,255,.2), 0 4px 10px rgba(0,0,0,.5); }
    .pin:hover .pin-chip { background: rgba(32,48,33,.9); transform: translateY(-1px); }
    .pin.sel { z-index: 5; }
    .pin.sel .pin-chip { background: var(--lime); color: var(--lime-ink); border-color: transparent; box-shadow: 0 10px 26px -6px rgba(200,240,60,.6); }
    .pin.sel .pin-chip em { color: rgba(20,33,15,.72); }
    .pin.sel .pin-chip .pdot { background: var(--lime-ink); box-shadow: none; }
    .pin.sel .pin-dot { background: var(--lime); animation: pinPulse 2.4s ease-out infinite; }
    @keyframes pinPulse { 0% { box-shadow: 0 0 0 0 rgba(200,240,60,.7), 0 4px 10px rgba(0,0,0,.5); } 80%,100% { box-shadow: 0 0 0 16px rgba(200,240,60,0), 0 4px 10px rgba(0,0,0,.5); } }
    @media (prefers-reduced-motion: reduce) { .pin.sel .pin-dot { animation: none; } }

    .proj-card {

    /* ---------- overview panel, work-mix donut, spend pills ---------- */
    .panel-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 18px 20px 4px; }

    .pills-wrap { position: relative; padding-top: 34px; }

    .pills::before {
      content: ""; position: absolute; left: 38px; right: 0; top: 0; bottom: 0; pointer-events: none;
      background: repeating-linear-gradient(180deg, rgba(255,255,255,.07) 0 1px, transparent 1px 25%);
    }
    .pills .ylab { position: absolute; left: 0; width: 32px; text-align: right; font-size: 10px; color: var(--faint); transform: translateY(50%); }
    .pcol { position: relative; flex: 1; height: 100%; display: flex; align-items: flex-end; justify-content: center; background: none; border: 0; padding: 0; color: inherit; cursor: pointer; }
    .pcol .track { position: absolute; left: 50%; top: 0; bottom: 0; width: 70%; max-width: 30px; transform: translateX(-50%); border-radius: 999px; background: rgba(255,255,255,.045); }
    .pcol .pill {
      position: relative; width: 70%; max-width: 30px; border-radius: 999px; min-height: 8px;

      transition: height .35s ease, background .2s;

      background: var(--lime); color: var(--lime-ink); font-size: 12px; font-weight: 700; padding: 5px 11px; border-radius: 999px; white-space: nowrap;

    .dash-row.two-eq .chart-card, .dash-row .chart-card { min-width: 0; }

    /* ---- Leaflet / Esri World Imagery ---- */
    .leaf-map, .leaf-bg { position: absolute; inset: 0; z-index: 0; background: transparent; }
    .leaf-bg { pointer-events: none; opacity: 0; transition: opacity .6s ease; }
    .stage-bg.sat-ok .leaf-bg { opacity: 1; }
    .leaf-map { opacity: 0; transition: opacity .6s ease; }
    .map-stage.sat-ok .leaf-map { opacity: 1; }
    .map-stage.sat-ok .map-svg, .stage-bg.sat-ok > .map-svg { opacity: 0; transition: opacity .8s ease .2s; }
    .leaflet-container { font: inherit; background: transparent !important; outline: none; }
    .leaflet-container a { color: var(--lime); }
    .leaflet-tile-pane { filter: brightness(1.04) saturate(.86) contrast(1.06); }
    .leaflet-tile { visibility: inherit; }
    .leaf-map::after, .leaf-bg::after {
      content: ""; position: absolute; inset: 0; z-index: 450; pointer-events: none;
      background:
        linear-gradient(rgba(11,56,64,.16), rgba(11,56,64,.16)),
        linear-gradient(180deg, rgba(7,16,12,.46), rgba(7,16,12,0) 22%, rgba(7,16,12,0) 70%, rgba(7,16,12,.4)),
        radial-gradient(115% 100% at 50% 46%, rgba(0,0,0,0) 58%, rgba(3,9,7,.42) 100%);
    }
    .map-stage::before { display: none; }
    .leaf-map .leaflet-control-container .leaflet-bottom.leaflet-left { margin-bottom: 4px; margin-left: 4px; }
    .leaflet-control-attribution {
      background: rgba(8,16,11,.66) !important; color: rgba(255,255,255,.78) !important; font-size: 10px; line-height: 1.3;
      padding: 3px 8px; border-radius: 8px; margin: 0 0 8px 8px !important; max-width: min(520px, 54vw);
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    }
    .leaflet-control-attribution a { color: var(--lime) !important; text-decoration: none; }
    .leaflet-bar { border: 0 !important; box-shadow: none !important; margin: 0 12px 8px 12px !important; }

    if (days < 0) days = 0;

    const rem = days - years * 365;
    const months = Math.floor(rem / 30);
    return { days, years, months };
  }

  function pebDonutChart(counts) {
    const labels = ["A","B","C","D","E","F","G"];
    const total = labels.reduce((s, l) => s + (counts[l] || 0), 0) || 1;
    const cx = 90, cy = 90, r = 58, r0 = 34;
    let a0 = -Math.PI / 2;
    const slices = [];
    labels.forEach((l) => {
      const n = counts[l] || 0;
      const a1 = a0 + (n / total) * Math.PI * 2;
      if (n > 0) {
        const large = (a1 - a0) > Math.PI ? 1 : 0;
        const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
        const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
        const ix0 = cx + r0 * Math.cos(a0), iy0 = cy + r0 * Math.sin(a0);
        const ix1 = cx + r0 * Math.cos(a1), iy1 = cy + r0 * Math.sin(a1);
        const d = `M ${x0} ${y0} A ${r} ${r} 0 ${large} 1 ${x1} ${y1} L ${ix1} ${iy1} A ${r0} ${r0} 0 ${large} 0 ${ix0} ${iy0} Z`;
        const tip = `${l}: ${n} · ${Math.round((n / total) * 100)}%`;
        slices.push(`<path class="hit" d="${d}" fill="${PEB_COLORS[l]}" data-tip="${esc(tip)}" data-filter-label="${l}"/>`);
      }
      a0 = a1;
    });
    const max = Math.max.apply(null, labels.map((l) => counts[l] || 0)) || 1;
    const bars = labels.map((l, i) => {
      const n = counts[l] || 0;
      const x = 190, y = 14 + i * 22, w = Math.max(n ? 8 : 0, (n / max) * 90);

        <text class="axis" x="${x + 22 + w}" y="${y + 12}">${n}</text>
      </g>`;
    }).join("");
    return `<svg class="chart-svg" viewBox="0 0 320 190" role="img" aria-label="${esc(t("chartPeb"))}" data-chart="peb-distribution">
      ${slices.join("")}
      <text x="${cx}" y="${cy - 4}" text-anchor="middle" font-size="18" font-weight="750" fill="#EEF2EA">${total}</text>

  function energyTrendChart() {
    const hist = ENERGY_HISTORY.slice();
    const now = certAverage();
    hist.push([2026, Math.round(now)]);
    const proj = [[2026, Math.round(now)]];
    for (let y = 2027; y <= 2033; y++) proj.push([y, Math.round(kwhAfterYear(y))]);
    const all = hist.concat(proj);
    const ys = all.map((p) => p[1]).concat([275, 150]);
    const minY = 80, maxY = Math.max.apply(null, ys) + 20;
    const w = 640, h = 210, l = 40, r = 12, top = 18, bot = 28;
    const x0 = 2018, x1 = 2033;
    const xOf = (yr) => l + ((yr - x0) / (x1 - x0)) * (w - l - r);
    const yOf = (v) => top + (1 - (v - minY) / (maxY - minY)) * (h - top - bot);
    const poly = (pts) => pts.map((p) => xOf(p[0]).toFixed(1) + "," + yOf(p[1]).toFixed(1)).join(" ");
    const ticks = [];
    for (let y = 2018; y <= 2033; y += 3) {
      ticks.push(`<line x1="${xOf(y)}" y1="${top}" x2="${xOf(y)}" y2="${h-bot}" stroke="rgba(255,255,255,.09)"/><text class="axis" x="${xOf(y)}" y="${h-10}" text-anchor="middle">${y}</text>`);
    }
    [150, 275].forEach((th, i) => {
      ticks.push(`<line x1="${l}" y1="${yOf(th)}" x2="${w-r}" y2="${yOf(th)}" stroke="${i ? "#FF8A6B" : "#4FD1A5"}" stroke-dasharray="4 3"/>
        <text x="${l + 4}" y="${yOf(th) - 4}" font-size="10" fill="${i ? "#FF8A6B" : "#4FD1A5"}" font-weight="700">${th}</text>`);
    });
    const hits = hist.concat(proj.slice(1)).map((p) => {
      const kind = p[0] <= 2026 ? t("histSeries") : t("projSeries");
      return `<circle class="hit" cx="${xOf(p[0])}" cy="${yOf(p[1])}" r="7" fill="${p[0] <= 2026 ? "#E9EFE3" : "#C8F03C"}" stroke="#0f1a12" stroke-width="1.5"
        data-tip="${esc(kind + " · " + p[0] + " · " + p[1] + " kWh/m²")}"/>`;
    }).join("");
    return `<svg class="chart-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(t("chartEnergy"))}" data-chart="energy-trend">
      ${ticks.join("")}
      <polyline fill="none" stroke="#E9EFE3" stroke-width="2.4" points="${poly(hist)}"/>
      <polyline fill="none" stroke="#C8F03C" stroke-width="2.4" stroke-dasharray="6 4" points="${poly(proj)}"/>
      ${hits}
    </svg>
    <div class="chart-legend">
      <span><i style="background:#E9EFE3"></i>${esc(t("histSeries"))} ${tag()}</span>
      <span><i style="background:#C8F03C"></i>${esc(t("projSeries"))} ${tag()}</span>
      <span><i style="background:#FF8A6B"></i>275 kWh — 2033</span>
      <span><i style="background:#4FD1A5"></i>150 kWh — ${esc(t("ms2045"))}</span>
    </div>`;
  }

      <span><i style="background:#C8F03C"></i>${esc(t("cat_heating"))}</span>
      <span><i style="background:#7F9188"></i>${esc(t("cat_cert"))}</span>
      <span><i style="background:#4FD08A"></i>${esc(t("stageGrant"))} (${esc(t("wallonia"))})</span>

  /* ===================== v3: map hero, work-mix donut, spend pills ===================== */
  function mulberry(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* Generated aerial "neighbourhood": rotated street grid, terraces, gardens, park, canal, a curved avenue. Pure SVG, no assets. */
  function buildMapGroup() {
    const R = mulberry(20261126);
    const pick = (a) => a[Math.floor(R() * a.length)];
    const roofs = ["#7d5a4c", "#6d4f44", "#8a6655", "#565b62", "#474c53", "#8f8573", "#75665a", "#645047"];
    const greens = ["#2b5028", "#33602e", "#244822", "#3c6c33", "#2d562a", "#42753a"];
    const parts = [];
    const cx = 600, cy = 400, reach = 820;
    // ground
    parts.push(`<rect x="-600" y="-600" width="2400" height="2000" fill="#33422e"/>`);
    parts.push(`<g transform="rotate(-16 ${cx} ${cy})">`);
    // grid
    const xs = [], ys = [];
    for (let x = -700; x < 1900; x += 150 + Math.floor(R() * 120)) xs.push(x);
    for (let y = -700; y < 1500; y += 130 + Math.floor(R() * 100)) ys.push(y);
    // roads
    xs.forEach((x, i) => parts.push(`<line x1="${x}" y1="-800" x2="${x}" y2="1600" stroke="#5f6057" stroke-width="${i % 3 === 0 ? 20 : 11}"/>`));
    ys.forEach((y, i) => parts.push(`<line x1="-800" y1="${y}" x2="2000" y2="${y}" stroke="#5f6057" stroke-width="${i % 3 === 1 ? 20 : 11}"/>`));
    // cells
    for (let i = 0; i < xs.length - 1; i++) {
      for (let j = 0; j < ys.length - 1; j++) {
        const x0 = xs[i] + 13, x1 = xs[i + 1] - 13, y0 = ys[j] + 13, y1 = ys[j + 1] - 13;
        const mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
        const rx = mx - cx, ry = my - cy;
        if (Math.sqrt(rx * rx + ry * ry) > reach) continue;
        const w = x1 - x0, h = y1 - y0;
        if (w < 40 || h < 40) continue;
        const roll = R();
        if (roll < 0.2) {
          // park with canopy
          parts.push(`<rect x="${x0}" y="${y0}" width="${w}" height="${h}" rx="10" fill="#2c4a28"/>`);
          const n = Math.floor((w * h) / 520);
          for (let k = 0; k < n; k++) {
            const tx = x0 + 8 + R() * (w - 16), ty = y0 + 8 + R() * (h - 16), tr = 6 + R() * 9;
            parts.push(`<circle cx="${(tx + 3).toFixed(1)}" cy="${(ty + 4).toFixed(1)}" r="${tr.toFixed(1)}" fill="rgba(0,0,0,.28)"/><circle cx="${tx.toFixed(1)}" cy="${ty.toFixed(1)}" r="${tr.toFixed(1)}" fill="${pick(greens)}"/>`);
          }
        } else if (roll < 0.3) {
          // planted rows (plots)
          parts.push(`<rect x="${x0}" y="${y0}" width="${w}" height="${h}" rx="6" fill="#4b6034"/>`);
          for (let yy = y0 + 6; yy < y1 - 2; yy += 9) parts.push(`<line x1="${x0 + 4}" y1="${yy}" x2="${x1 - 4}" y2="${yy}" stroke="#2c4524" stroke-width="5" stroke-dasharray="7 3" stroke-linecap="round"/>`);
        } else {
          // gardens + terraces
          parts.push(`<rect x="${x0}" y="${y0}" width="${w}" height="${h}" rx="6" fill="#3a5232"/>`);
          const rows = h > 120 ? 2 : 1;
          for (let r = 0; r < rows; r++) {
            const hy = rows === 1 ? my - 12 : (r === 0 ? y0 + 8 : y1 - 36);
            let hx = x0 + 6;
            while (hx < x1 - 24) {
              const hw = 22 + Math.floor(R() * 22), hh = 20 + Math.floor(R() * 12);
              if (hx + hw > x1 - 4) break;
              if (R() > 0.12) {
                const col = pick(roofs);
                parts.push(`<rect x="${hx + 3}" y="${hy + 4}" width="${hw}" height="${hh}" rx="2" fill="rgba(0,0,0,.34)"/><rect x="${hx}" y="${hy}" width="${hw}" height="${hh}" rx="2" fill="${col}"/><line x1="${hx + 2}" y1="${hy + hh / 2}" x2="${hx + hw - 2}" y2="${hy + hh / 2}" stroke="rgba(255,255,255,.22)" stroke-width="1.5"/>`);
              }
              hx += hw + 3;
            }
          }
          const tn = Math.floor((w * h) / 2600);
          for (let k = 0; k < tn; k++) {
            const tx = x0 + 6 + R() * (w - 12), ty = y0 + 6 + R() * (h - 12), tr = 4 + R() * 5;
            parts.push(`<circle cx="${tx.toFixed(1)}" cy="${ty.toFixed(1)}" r="${tr.toFixed(1)}" fill="${pick(greens)}" opacity=".9"/>`);
          }
        }
      }
    }
    // canal
    parts.push(`<path d="M -900 90 C -200 20 360 280 1000 130 S 1900 80 2100 160" fill="none" stroke="#244a52" stroke-width="46" stroke-linecap="round"/>`);
    parts.push(`<path d="M -900 90 C -200 20 360 280 1000 130 S 1900 80 2100 160" fill="none" stroke="#3b747c" stroke-width="30" stroke-linecap="round" opacity=".9"/>`);
    parts.push(`<path d="M -900 90 C -200 20 360 280 1000 130 S 1900 80 2100 160" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="3" stroke-dasharray="14 22"/>`);
    parts.push(`</g>`);
    // curved avenue (unrotated, sweeping)
    const av = "M -120 640 C 220 470 470 700 760 520 S 1180 330 1400 420";
    parts.push(`<path d="${av}" fill="none" stroke="#5f6054" stroke-width="40" stroke-linecap="round"/>`);
    parts.push(`<path d="${av}" fill="none" stroke="#85867a" stroke-width="32" stroke-linecap="round"/>`);
    parts.push(`<path d="${av}" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2" stroke-dasharray="16 14"/>`);
    // grain
    for (let k = 0; k < 420; k++) {
      parts.push(`<circle cx="${(R() * 1200).toFixed(0)}" cy="${(R() * 800).toFixed(0)}" r="${(0.8 + R() * 1.6).toFixed(1)}" fill="${R() > 0.5 ? "rgba(255,255,255,.08)" : "rgba(0,0,0,.1)"}"/>`);
    }
    return parts.join("");
  }

  /* ---- v4: real satellite imagery (Esri World Imagery via Leaflet), geo-anchored pins ---- */
  const ESRI_URL = "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}";
  const MAP_CENTER = [50.44089, 3.94958];
  const GEO = {
    acacias: [50.440992, 3.948537], stgilles: [50.441804, 3.946775], ixelles: [50.441697, 3.949711],
    montgomery: [50.440073, 3.949000], uccle: [50.440073, 3.951304], namur: [50.442338, 3.949627],
    "liege-house": [50.4412, 3.951543], coteaux: [50.439988, 3.946271], schaerbeek: [50.440787, 3.946082]
  };
  function geoOf(b, i) {
    if (GEO[b.id]) return GEO[b.id];
    const k = i || 0;
    return [MAP_CENTER[0] + 0.0006 * ((k % 3) - 1), MAP_CENTER[1] + 0.0009 * ((k % 4) - 1.5)];
  }
  let heroMap = null, heroMarkers = {}, heroParcel = null, bgMap = null;
  function isCoarse() { return !!(window.matchMedia && window.matchMedia("(pointer: coarse)").matches); }
  function destroyHeroMapOnly() {
    if (heroMap) { try { heroMap.remove(); } catch (e) {} }
    heroMap = null; heroMarkers = {}; heroParcel = null;
  }
  function destroyHeroMap() {
    if (heroMap) { try { heroMap.remove(); } catch (e) {} }
    heroMap = null; heroMarkers = {}; heroParcel = null;
    if (bgMap) { try { bgMap.remove(); } catch (e) {} bgMap = null; }
  }
  function makeSatLayer(onOk) {
    const tl = L.tileLayer(ESRI_URL, { maxNativeZoom: 19, maxZoom: 19, minZoom: 14, detectRetina: false, keepBuffer: 2, updateWhenIdle: false, crossOrigin: false });
    let ok = false;
    tl.on("tileload", () => { if (!ok) { ok = true; onOk(); } });
    tl.on("tileerror", (e) => { if (e && e.tile) e.tile.style.visibility = "hidden"; });
    return tl;
  }

  function mixData() {
    const { years, data } = capexData();
    const cats = ["envelope", "windows", "heating", "cert"];
    const tot = {};
    cats.forEach((c) => { tot[c] = 0; years.forEach((y) => { tot[c] += data[y][c]; }); });
    const sum = cats.reduce((s, c) => s + tot[c], 0) || 1;
    return { cats, tot, sum };
  }
  const MIX_COL = { envelope: "#C8F03C", windows: "#2FB98A", heating: "#F4F7F0", cert: "#7F9188" };

  function workMixHtml() {
    const { cats, tot, sum } = mixData();
    const cx = 94, cy = 94, sw = 8, gap = 3;
    const sweep = 270, start = 135;
    const polar = (r, ang) => { const a = ang * Math.PI / 180; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
    const arc = (r, a0, a1) => {
      const [x0, y0] = polar(r, a0), [x1, y1] = polar(r, a1);
      return `M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 ${(a1 - a0) > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
    };
    const rings = cats.map((c, i) => {
      const r = 84 - i * (sw + gap);
      const share = tot[c] / sum;
      const a1 = start + Math.max(0.02, share) * sweep;
      return `<path d="${arc(r, start, start + sweep)}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="${sw}" stroke-linecap="round"/>
        <path d="${arc(r, start, a1)}" fill="none" stroke="${MIX_COL[c]}" stroke-width="${sw}" stroke-linecap="round"/>`;
    }).join("");
    const legend = cats.map((c) => `<div class="row"><i class="sw" style="background:${MIX_COL[c]}"></i><span class="nm">${esc(t("cat_" + c))}</span><span class="pc">${Math.round(tot[c] / sum * 100)}%</span></div>`).join("");
    return `<div class="mix">
      <div class="mix-ring"><svg viewBox="0 0 188 188" role="img" aria-label="${esc(t("workMixTitle"))}">${rings}</svg>
        <div class="ctr"><b>${esc(eurCompact(sum))}</b><span>${esc(t("totalCapex"))}</span></div></div>
      <div class="mix-legend">${legend}</div>
    </div>`;
  }

  function spendYears() {

  function spendHtml() {
    const rows = spendYears();
    const max = Math.max.apply(null, rows.map((r) => r.total)) || 1;
    if (!state.spendYear || !rows.some((r) => r.y === state.spendYear)) {
      state.spendYear = rows.reduce((m, r) => (r.total > m.total ? r : m), rows[0]).y;
    }
    const top = Math.ceil(max / 100000) * 100000;
    const ticks = [0, 0.25, 0.5, 0.75, 1].map((f) => `<span class="ylab" style="bottom:${f * 100}%">${f === 0 ? "0" : eurCompact(top * f)}</span>`).join("");
    const cols = rows.map((r) => {
      const on = r.y === state.spendYear;
      return `<button class="pcol${on ? " on" : ""}" data-spend="${r.y}" aria-pressed="${on}" aria-label="${r.y} ${esc(fmtMoney(r.total))}">

    const cur = rows.find((r) => r.y === state.spendYear);

    const cur = labels.indexOf(b.label);
    const target2033 = 4; /* E — 275 ≈ class E max */
    const target2045 = 2; /* C — 150 ≈ class C max */
    const last = b.stages[b.stages.length - 1];
    const afterL = last ? last.afterLabel : b.label;
    const afterI = labels.indexOf(afterL);
    const w = 640, h = 86, x0 = 28, bw = (w - 56) / 7;
    const cells = labels.map((l, i) => {
      const x = x0 + i * bw;
      return `<rect x="${x}" y="28" width="${bw - 6}" height="22" rx="5" fill="${PEB_COLORS[l]}"/>
        <text x="${x + (bw - 6) / 2}" y="44" text-anchor="middle" font-size="12" font-weight="800" fill="${l === "C" || l === "D" ? "#1a1a00" : "#fff"}">${l}</text>`;
    }).join("");
    const marker = (i, color, label, y) => {
      const x = x0 + i * bw + (bw - 6) / 2;
      return `<polygon points="${x},${y} ${x - 6},${y - 9} ${x + 6},${y - 9}" fill="${color}"/>
        <text x="${x}" y="${y - 12}" text-anchor="middle" font-size="10" font-weight="700" fill="${color}">${esc(label)}</text>`;
    };
    return `<svg class="chart-svg peb-scale" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(t("pebScale"))}">
      ${cells}
      ${marker(cur, "#EEF2EA", t("scaleNow") + " " + b.label, 26)}
      ${b.region === "brussels" ? marker(target2033, "#FF8A6B", "2033 · E", 80) : ""}
      ${afterI >= 0 ? `<circle cx="${x0 + afterI * bw + (bw - 6) / 2}" cy="39" r="11" fill="none" stroke="#E9EFE3" stroke-width="2"/>` : ""}
    </svg>
    <div class="chart-legend">
      <span>${esc(t("scaleNow"))}: <b>${b.label}</b> (${fmtNum(b.kwh)})</span>
      ${b.region === "brussels" ? `<span>${esc(t("target275"))}</span>` : `<span>${esc(t("targetA"))}</span>`}
      <span>${esc(t("afterWorks"))}: <b>${afterL}</b> (${last ? fmtNum(last.afterKwh) : "—"})</span>
    </div>`;
  }

  function kwhGaugeGraphic(b) {
    const last = b.stages[b.stages.length - 1];
    const after = last ? last.afterKwh : b.kwh;
    const max = 450;
    const w = 640, h = 78, x0 = 28, iw = w - 56;
    const xOf = (v) => x0 + (Math.max(0, Math.min(max, v)) / max) * iw;
    return `<svg class="chart-svg kwh-gauge" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(t("kwhGauge"))}">
      <rect x="${x0}" y="30" width="${iw}" height="14" rx="7" fill="rgba(255,255,255,.1)"/>
      <rect x="${x0}" y="30" width="${xOf(b.kwh) - x0}" height="14" rx="7" fill="${PEB_COLORS[b.label]}"/>
      <line x1="${xOf(275)}" y1="22" x2="${xOf(275)}" y2="52" stroke="#FF8A6B" stroke-width="2"/>
      <text x="${xOf(275)}" y="16" text-anchor="middle" font-size="10" fill="#FF8A6B" font-weight="700">275</text>
      <line x1="${xOf(150)}" y1="22" x2="${xOf(150)}" y2="52" stroke="#4FD1A5" stroke-width="2" stroke-dasharray="3 2"/>
      <text x="${xOf(150)}" y="16" text-anchor="middle" font-size="10" fill="#4FD1A5" font-weight="700">150</text>
      <polygon points="${xOf(b.kwh)},48 ${xOf(b.kwh) - 6},62 ${xOf(b.kwh) + 6},62" fill="#EEF2EA"/>
      <text x="${xOf(b.kwh)}" y="74" text-anchor="middle" font-size="10" font-weight="700">${fmtNum(b.kwh)}</text>
      <circle cx="${xOf(after)}" cy="37" r="6" fill="#C8F03C" stroke="#E9EFE3" stroke-width="1.5"/>
      <text x="${xOf(after)}" y="${xOf(after) < xOf(b.kwh) - 20 ? 26 : 74}" text-anchor="middle" font-size="10" fill="#E9EFE3">${esc(t("afterWorks"))} ${fmtNum(after)}</text>
    </svg>`;

  function ganttGraphic(b) {
    const years = [2026,2027,2028,2029,2030,2031];
    const rowH = 28, top = 24, l = 160, w = 700, h = top + b.stages.length * rowH + 20;
    const iw = w - l - 16;
    const col = iw / years.length;
    const rows = b.stages.map((s, i) => {
      const m = stageMeta(b, s);
      const yi = years.indexOf(m.year);
      const x = l + (yi < 0 ? 0 : yi * col) + 4;
      const y = top + i * rowH;
      const title = LT(s.fr, s.en);
      const fill = s.done ? "#4FD08A" : CAT_COLORS[m.cat] || "#E9EFE3";
      return `<text class="axis" x="8" y="${y + 16}" fill="#EEF2EA">${esc(title.length > 28 ? title.slice(0, 27) + "…" : title)}</text>
        <rect class="hit" x="${x}" y="${y + 6}" width="${col - 8}" height="16" rx="4" fill="${fill}" data-tip="${esc(title + " · " + m.year + " · " + fmtMoney(s.cost))}"/>`;
    }).join("");
    const heads = years.map((y, i) => `<text class="axis" x="${l + i * col + col / 2}" y="16" text-anchor="middle">${y}</text>`).join("");
    return `<div class="gantt-scroller"><svg class="chart-svg gantt-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(t("ganttTitle"))}">${heads}${rows}</svg></div>`;
  }

  function waterfallGraphic(b) {
    const brussels = b.region === "brussels";
    const items = b.stages.map((s) => ({ label: LT(s.fr, s.en), v: s.cost }));
    const grants = b.stages.reduce((s, x) => s + (x.grant || 0), 0);
    const gross = items.reduce((s, x) => s + x.v, 0);
    const netGrant = brussels ? 0 : grants;
    const steps = items.concat(netGrant ? [{ label: t("stageGrant"), v: -netGrant }] : []);
    steps.push({ label: t("totalNet"), v: 0, total: gross - netGrant, isTotal: true });
    const max = gross;
    const n = steps.length;
    const w = Math.max(640, 80 + n * 70), h = 200, l = 16, top = 16, bot = 48, col = (w - l - 16) / n;
    const yOf = (v) => top + (1 - v / (max * 1.08 || 1)) * (h - top - bot);
    let acc = 0;
    const bars = steps.map((s, i) => {
      let y, ht, fill, tip, base;
      if (s.isTotal) {
        y = yOf(s.total); ht = yOf(0) - y; fill = "#E9EFE3"; tip = s.label + " · " + fmtMoney(s.total); base = 0;
      } else if (s.v >= 0) {
        y = yOf(acc + s.v); ht = yOf(acc) - y; fill = CAT_COLORS[stageMeta(b, b.stages[i] || {n:1}).cat] || "#4FD1A5";
        acc += s.v; tip = s.label + " · " + fmtMoney(s.v);
      } else {
        y = yOf(acc); ht = yOf(acc + s.v) - yOf(acc); fill = "#4FD08A";
        tip = s.label + " · −" + fmtMoney(-s.v); acc += s.v;
      }
      const x = l + i * col + 8;
      const lab = s.label.length > 14 ? s.label.slice(0, 13) + "…" : s.label;
      return `<rect class="hit" x="${x}" y="${Math.min(y, y + (ht < 0 ? ht : 0))}" width="${col - 16}" height="${Math.abs(ht)}" fill="${fill}" data-tip="${esc(tip)}"/>
        <text class="axis" x="${x + (col - 16) / 2}" y="${h - 20}" text-anchor="middle">${esc(lab)}</text>`;
    }).join("");
    const note = brussels ? `<p class="faint" style="margin:6px 0 0;font-size:11px">${esc(t("renolutionNotice"))}</p>` : "";
    return `<div class="gantt-scroller"><svg class="chart-svg wf-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(t("waterfallTitle"))}">${bars}</svg></div>${note}`;
  }

  function dossierCats(b) {
    const pack = docsFor(b.id);
    const checks = state.checks[b.id] || pack.checks;
    const cats = [
      { k:"cert", fr:"Certificats", en:"Certificates", ids: (c) => /certificat|certificate|PEB/i.test(c.fr + c.en) },
      { k:"quote", fr:"Devis", en:"Quotes", ids: (c) => /devis|quote/i.test(c.fr + c.en) },
      { k:"invoice", fr:"Factures", en:"Invoices", ids: (c) => /facture|invoice/i.test(c.fr + c.en) },
      { k:"photo", fr:"Photos / fiches", en:"Photos / sheets", ids: (c) => /photo|fiche|sheet/i.test(c.fr + c.en) }
    ];
    return cats.map((cat) => {
      const items = checks.filter(cat.ids);
      const held = items.filter((c) => c.done).length;
      const need = items.length || 0;
      return { label: LT(cat.fr, cat.en), held, need, pct: need ? Math.round(held / need * 100) : 0 };
    });
  }

  function calendarStrip() {
    const items = state.reminders.filter((r) => !r.done);
    const start = new Date("2026-11-23T12:00:00+01:00");
    const days = [];
    for (let i = 0; i < 56; i++) {
      const d = new Date(start); d.setDate(start.getDate() + i);
      days.push(d);
    }
    const iso = (d) => d.toISOString().slice(0, 10);
    const cell = 28, w = 16 + days.length * cell, h = 78;
    const boxes = days.map((d, i) => {
      const key = iso(d);
      const hits = items.filter((r) => (r.snooze || r.due) === key);
      const x = 8 + i * cell;
      const isToday = key === "2026-11-23" || key === iso(new Date());
      const cls = "cal-day" + (hits.length ? " has" : "") + (isToday ? " today" : "");
      const tip = hits.length ? hits.map((r) => (LT(r.fr, r.en))).join(" · ") : fmtDate(key);
      const later = false;
      return `<g class="hit" data-tip="${esc(tip)}" ${hits.length ? `data-scroll-reminder="${hits[0].id}"` : ""}>
        <rect class="${cls}" x="${x}" y="24" width="${cell - 4}" height="${cell - 2}" rx="6"/>
        <text class="axis" x="${x + (cell - 4) / 2}" y="42" text-anchor="middle" fill="#EEF2EA">${d.getDate()}</text>
        ${i === 0 || d.getDate() === 1 ? `<text class="axis" x="${x}" y="16">${fmtDate(key).replace(/\d+\s?/, "").slice(0, 8)}</text>` : ""}
      </g>`;
    }).join("");
    const later = items.filter((r) => (r.snooze || r.due) > iso(days[days.length - 1]));
    return `<div class="cal-scroller"><svg class="chart-svg cal-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(t("calTitle"))}">${boxes}</svg></div>
      ${later.length ? `<p class="faint" style="margin:8px 0 0;font-size:12px">${esc(t("calLater"))}: ${later.length}</p>` : ""}`;
  }


  function go(view, id) {
    if (id) state.buildingId = id;
    state.view = view;
    state.sidebarOpen = false;
    const path = view === "dashboard" ? "#/dashboard"
      : view === "portfolio" ? "#/portfolio"
      : view === "reminders" ? "#/reminders"
      : view === "plan" ? "#/plan/" + state.buildingId
      : view === "dossier" ? "#/dossier/" + state.buildingId
      : view === "new" ? "#/building/new"
      : "#/building/" + state.buildingId;
    if (location.hash !== path) history.pushState(null, "", path);
    render();
  }

  function parseHash() {
    const h = (location.hash || "#/portfolio").replace(/^#/, "");
    const parts = h.split("/").filter(Boolean);
    const v = parts[0] || "dashboard";
    if (v === "dashboard" || v === "overview") { state.view = "dashboard"; return; }
    if (v === "portfolio") { state.view = "portfolio"; return; }
    if (v === "reminders") { state.view = "reminders"; return; }
    if (v === "plan") { state.view = "plan"; if (parts[1]) state.buildingId = parts[1]; return; }
    if (v === "dossier") { state.view = "dossier"; if (parts[1]) state.buildingId = parts[1]; return; }
    if (v === "building" && parts[1] === "new") { state.view = "new"; return; }
    if (v === "building") { state.view = "building"; if (parts[1]) state.buildingId = parts[1]; return; }
    state.view = "dashboard";
  }

  function bindUpload() {
    const drop = $("drop");
    const input = $("fileIn");
    if (!drop || !input) return;
    const start = (name) => simulateParse(name);
    $("pickBtn").addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); input.click(); });
    input.addEventListener("change", () => {
      const f = input.files && input.files[0];
      start(f ? f.name : t("demoParsedName"));
    });
    ["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("drag"); }));
    ["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("drag"); }));
    drop.addEventListener("drop", (e) => {
      const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      start(f ? f.name : t("demoParsedName"));
    });
  }

        if (g === "status") state.status = v;
        render();

      btn.addEventListener("click", (e) => {

        const el = document.querySelector("[data-done=\"" + id + "\"], [data-snooze=\"" + id + "\"]");
        if (el) el.closest(".remind").scrollIntoView({ behavior: "smooth", block: "center" });
      });
    });
    main.querySelectorAll(".stage-h").forEach((h) => {
      h.addEventListener("click", () => h.parentElement.classList.toggle("open"));
    });
    const sharePlan = $("sharePlanBtn");
    if (sharePlan) sharePlan.addEventListener("click", () => toast(t("planShared")));
    const pdfBtn = $("pdfBtn");
    if (pdfBtn) pdfBtn.addEventListener("click", () => { toast(t("exportToast")); setTimeout(() => window.print(), 250); });
    const shareBtn = $("shareBtn");
    if (shareBtn) shareBtn.addEventListener("click", openShareModal);
    const agBtn = $("agBtn");
    if (agBtn) agBtn.addEventListener("click", () => toast(t("agToast")));
    main.querySelectorAll("[data-check]").forEach((box) => {
      box.addEventListener("change", () => {
        const [bid, cid] = box.getAttribute("data-check").split(":");
        const list = state.checks[bid] || [];
        const item = list.find((c) => c.id === cid);
        if (item) item.done = box.checked;
        render();
      });
    });
    main.querySelectorAll("[data-done]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const r = state.reminders.find((x) => x.id === btn.getAttribute("data-done"));
        if (r) { r.done = true; toast(t("markedDone")); render(); }
      });
    });
    main.querySelectorAll("[data-snooze]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const r = state.reminders.find((x) => x.id === btn.getAttribute("data-snooze"));
        if (!r) return;
        if (r.snooze) r.snooze = null;
        else r.snooze = addDays(r.due, 7);
        toast(t("reminderSnoozed"));
        render();
      });
    });
  }

  /* Fix search rebind: use a named handler stored on state */
  function bindSearch() {
    const q = $("q");
    if (!q) return;
    q.oninput = () => {
      state.query = q.value;
      if (state.view !== "portfolio") {
        state.view = "portfolio";
        history.pushState(null, "", "#/portfolio");
      }
      const caret = q.selectionStart;
      renderPortfolio();
      bindMainEvents();
      renderTopbar();
      const nq = $("q");
      if (nq) {
        nq.value = state.query;
        nq.focus();
        try { nq.setSelectionRange(caret, caret); } catch (e) {}
        bindSearch();
      }
    };
  }

  function render() {
    destroyHeroMapOnly();
    parseHash();
    renderSidebar();
    renderBanner();
    renderTopbar();
    if (state.view === "dashboard") renderDashboard();
    else if (state.view === "portfolio") renderPortfolio();
    else if (state.view === "plan") renderPlan();
    else if (state.view === "dossier") renderDossier();
    else if (state.view === "reminders") renderReminders();
    else renderBuilding();
    bindMainEvents();
    bindSearch();
    const menu = $("menuBtn");
    if (menu) menu.onclick = () => { state.sidebarOpen = !state.sidebarOpen; renderSidebar(); bindSidebar(); };
    $("scrim").onclick = () => { state.sidebarOpen = false; renderSidebar(); bindSidebar(); };
    bindSidebar();
    const bell = $("bellBtn");
    if (bell) bell.onclick = () => go("reminders", state.buildingId);
  };

  function bindSidebar() {
    $("sidebar").querySelectorAll("[data-go]").forEach((btn) => {
      btn.onclick = () => go(btn.getAttribute("data-go"), state.buildingId);
    });
    $("sidebar").querySelectorAll("[data-lang]").forEach((btn) => {
      btn.onclick = () => setLang(btn.getAttribute("data-lang"));
    });
  }

  try {
    const saved = localStorage.getItem("renopath-lang-v2");
    if (saved === "en" || saved === "fr" || saved === "nl") state.lang = saved;
  } catch (e) {}
  const params = new URLSearchParams(location.search);
  if (["en", "fr", "nl"].indexOf(params.get("lang")) >= 0) state.lang = params.get("lang");

  window.addEventListener("hashchange", () => render());
  window.addEventListener("popstate", () => render());
  if (!location.hash) history.replaceState(null, "", "#/dashboard");
  document.documentElement.lang = state.lang;
  document.title = t("title");
  initBackdrop();
  render();
})();
</script>
</body>
</html>
