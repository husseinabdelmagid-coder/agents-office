<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>RenoPath — maquette</title>
  <style>
    :root {
      --teal-950: #0E2F31;
      --teal-900: #164E50;
      --teal-800: #1A5C5A;
      --teal-700: #21776A;
      --teal-600: #25887A;
      --lime: #88DE7B;
      --lime-soft: #CEF1C9;
      --lime-wash: #E8F8E4;
      --ink: #181818;
      --muted: #595959;
      --faint: #7F7F7F;
      --line: #E2E8E5;
      --line-strong: #C9D4D0;
      --bg: #F3F5F4;
      --card: #FFFFFF;
      --warn: #B45309;
      --warn-bg: #FEF3C7;
      --danger: #B42318;
      --danger-bg: #FEE4E2;
      --ok: #16794A;
      --ok-bg: #E4F6EC;
      --info-bg: #E6F3F1;
      --banner-bg: #F6E7B8;
      --banner-ink: #5C4A12;
      --banner-line: #E2C56A;
      --shadow: 0 1px 2px rgba(16, 40, 36, .06), 0 8px 24px rgba(16, 40, 36, .05);
      --radius: 14px;
      --sidebar: 232px;
      --banner-h: 36px;
      --topbar-h: 56px;
      --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: var(--sans);
      color: var(--ink);
      background: var(--bg);
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    button, input, select { font-family: inherit; font-size: inherit; }
    button { cursor: pointer; }
    a { color: var(--teal-700); }
    .app { min-height: 100%; display: flex; }
    .sidebar {
      width: var(--sidebar);
      flex: 0 0 var(--sidebar);
      background: var(--teal-900);
      color: #fff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
    }
    .brand {
      display: flex; align-items: center; gap: 10px;
      padding: 20px 18px 16px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .brand-mark {
      width: 32px; height: 32px; border-radius: 9px;
      background: var(--lime);
      display: grid; place-items: center;
      flex: 0 0 32px;
    }
    .brand-mark svg { width: 18px; height: 18px; }
    .brand-name { font-weight: 700; font-size: 16px; letter-spacing: -.02em; line-height: 1.1; }
    .brand-name span { color: var(--lime); }
    .brand-sub { font-size: 11px; color: rgba(255,255,255,.62); margin-top: 1px; }
    .nav { padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
    .nav-label {
      font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
      color: rgba(255,255,255,.45); padding: 10px 10px 6px; font-weight: 600;
    }
    .nav-btn {
      display: flex; align-items: center; gap: 10px;
      border: 0; background: transparent; color: rgba(255,255,255,.86);
      text-align: left; padding: 9px 10px; border-radius: 9px; width: 100%;
      font-weight: 550;
    }
    .nav-btn svg { width: 18px; height: 18px; flex: 0 0 18px; opacity: .9; }
    .nav-btn:hover { background: rgba(255,255,255,.08); }
    .nav-btn.active { background: rgba(136,222,123,.18); color: #fff; }
    .nav-btn.active svg { opacity: 1; color: var(--lime); }
    .nav-mod {
      margin-left: auto; font-size: 10px; font-weight: 700;
      letter-spacing: .04em; color: rgba(255,255,255,.45);
      font-variant-numeric: tabular-nums;
    }
    .nav-btn.active .nav-mod { color: var(--lime); }
    .nav-building {
      margin: 0 10px 12px; padding: 10px 10px;
      background: rgba(0,0,0,.18); border-radius: 10px;
      border: 1px solid rgba(255,255,255,.06);
    }
    .nav-building .nb-k { font-size: 10px; color: rgba(255,255,255,.5); }
    .nav-building .nb-v { font-size: 12px; font-weight: 600; margin-top: 2px; color: #fff; }
    .sidebar-foot { padding: 12px 16px 16px; border-top: 1px solid rgba(255,255,255,.08); }
    .lang-toggle {
      display: flex; background: rgba(0,0,0,.22); border-radius: 999px; padding: 3px;
    }
    .lang-toggle button {
      flex: 1; border: 0; background: transparent; color: rgba(255,255,255,.7);
      border-radius: 999px; padding: 6px 0; font-weight: 700; font-size: 12px;
    }
    .lang-toggle button.on { background: var(--lime); color: var(--teal-950); }
    .workspace { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 100vh; }
    .banner {
      position: sticky; top: 0; z-index: 40;
      height: var(--banner-h);
      background: var(--banner-bg); color: var(--banner-ink);
      border-bottom: 1px solid var(--banner-line);
      display: flex; align-items: center; justify-content: center; gap: 8px;
      font-size: 12px; font-weight: 650; letter-spacing: .01em;
    }
    .banner .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
    .topbar {
      height: var(--topbar-h);
      display: flex; align-items: center; gap: 12px;
      padding: 0 22px;
      background: var(--card);
      border-bottom: 1px solid var(--line);
      position: sticky; top: var(--banner-h); z-index: 30;
    }
    .menu-btn {
      display: none; width: 36px; height: 36px; border: 1px solid var(--line);
      background: #fff; border-radius: 8px; align-items: center; justify-content: center;
    }
    .crumbs { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .crumbs b { color: var(--ink); font-weight: 650; }
    .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
    .search {
      display: flex; align-items: center; gap: 6px;
      background: var(--bg); border: 1px solid var(--line); border-radius: 9px;
      padding: 0 10px; height: 34px; width: 260px;
    }
    .search input {
      border: 0; background: transparent; outline: none; width: 100%; color: var(--ink);
    }
    .search svg, .ico { width: 18px; height: 18px; }
    .search svg { width: 15px; height: 15px; color: var(--faint); flex: 0 0 15px; }
    .upload .ico, .upload svg { width: 36px !important; height: 36px !important; display: block; margin: 0 auto 6px; color: var(--teal-700); }
    .notice svg { width: 22px !important; height: 22px !important; flex: 0 0 22px; margin-top: 1px; }
    .doc .di svg { width: 18px !important; height: 18px !important; }
    .peb-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 14px; align-items: start; }
    .toolbar .btn.primary { margin-left: auto; }
    .userpill { display: flex; align-items: center; gap: 8px; }
    .avatar {
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--teal-700); color: #fff; display: grid; place-items: center;
      font-weight: 700; font-size: 11px;
    }
    .userpill .un { font-weight: 650; font-size: 12px; line-height: 1.2; }
    .userpill .ur { font-size: 11px; color: var(--faint); }
    main { padding: 22px 24px 48px; flex: 1; }
    h1 { font-size: 22px; letter-spacing: -.03em; margin: 0 0 4px; font-weight: 750; }
    .lede { color: var(--muted); margin: 0 0 18px; max-width: 720px; }
    .ex-tag {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 10px; font-weight: 700; letter-spacing: .02em;
      text-transform: uppercase; color: var(--banner-ink);
      background: var(--banner-bg); border: 1px solid var(--banner-line);
      border-radius: 999px; padding: 1px 7px; vertical-align: middle;
      white-space: nowrap;
    }
    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
    .kpi {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 14px 16px; box-shadow: var(--shadow);
    }
    .kpi .k { font-size: 11px; color: var(--muted); font-weight: 600; }
    .kpi .v { font-size: 26px; font-weight: 750; letter-spacing: -.03em; margin: 4px 0 2px;
      font-variant-numeric: tabular-nums; }
    .kpi .s { font-size: 11px; color: var(--faint); }
    .kpi.warn .v { color: var(--warn); }
    .kpi.danger .v { color: var(--danger); }
    .kpi.ok .v { color: var(--ok); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 12px; }
    .seg {
      display: flex; flex-wrap: wrap; gap: 0; background: var(--card);
      border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
    }
    .seg button {
      border: 0; background: transparent; padding: 7px 11px; color: var(--muted);
      font-weight: 600; font-size: 12px; border-right: 1px solid var(--line);
    }
    .seg button:last-child { border-right: 0; }
    .seg button.on { background: var(--teal-900); color: #fff; }
    .btn {
      border: 1px solid var(--line); background: #fff; color: var(--ink);
      border-radius: 10px; padding: 8px 13px; font-weight: 650; font-size: 13px;
      display: inline-flex; align-items: center; gap: 7px;
    }
    .btn:hover { border-color: var(--line-strong); background: #fafcfb; }
    .btn svg { width: 15px; height: 15px; }
    .btn.primary { background: var(--teal-700); border-color: var(--teal-700); color: #fff; }
    .btn.primary:hover { background: var(--teal-800); }
    .btn.ghost { background: transparent; }
    .btn.lime { background: var(--lime); border-color: #6dcc61; color: var(--teal-950); }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      box-shadow: var(--shadow); overflow: hidden;
    }
    .card-h { padding: 14px 16px 0; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .card-h h2 { font-size: 15px; margin: 0; letter-spacing: -.01em; }
    .card-b { padding: 14px 16px 16px; }
    table.list { width: 100%; border-collapse: collapse; }
    table.list th {
      text-align: left; font-size: 11px; letter-spacing: .04em; text-transform: uppercase;
      color: var(--faint); font-weight: 700; padding: 10px 12px; border-bottom: 1px solid var(--line);
      background: #f9faf9; white-space: nowrap;
    }
    table.list td {
      padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: middle;
      font-variant-numeric: tabular-nums;
    }
    table.list tr:last-child td { border-bottom: 0; }
    table.list tbody tr { cursor: pointer; }
    table.list tbody tr:hover { background: #f6faf8; }
    .bname { font-weight: 700; color: var(--ink); }
    .baddr { font-size: 12px; color: var(--faint); }
    .chip {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 26px; height: 26px; padding: 0 7px; border-radius: 7px;
      font-weight: 800; font-size: 12px; letter-spacing: .02em; color: #fff;
    }
    .chip.A { background: #007A3D; }
    .chip.B { background: #50A30A; }
    .chip.C { background: #C0C000; color: #1a1a00; }
    .chip.D { background: #F7E300; color: #3a3200; }
    .chip.E { background: #F5A000; }
    .chip.F { background: #E85D04; }
    .chip.G { background: #D0001F; }
    .reg {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 12px; font-weight: 650; color: var(--teal-800);
    }
    .reg i { width: 7px; height: 7px; border-radius: 50%; background: var(--teal-700); display: inline-block; }
    .reg.wal { color: #6B4F1D; }
    .reg.wal i { background: #C9842A; }
    .st {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px;
      white-space: nowrap;
    }
    .st.at_risk { background: var(--danger-bg); color: var(--danger); }
    .st.in_progress { background: #E8EEFE; color: #3730A3; }
    .st.planned { background: var(--warn-bg); color: var(--warn); }
    .st.compliant { background: var(--ok-bg); color: var(--ok); }
    .st.indicative { background: var(--info-bg); color: var(--teal-700); }
    .st.review { background: #F3F4F6; color: #3F3F46; }
    .cdown { font-weight: 650; }
    .cdown.ok { color: var(--ok); }
    .cdown.warn { color: var(--warn); }
    .cdown.mute { color: var(--faint); font-weight: 550; }
    .empty { padding: 28px; text-align: center; color: var(--muted); }
    .grid-2 { display: grid; grid-template-columns: 1.3fr .7fr; gap: 14px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .upload {
      border: 1.5px dashed var(--line-strong); border-radius: 12px;
      background: #f8fbf9; padding: 18px 16px; text-align: center; color: var(--muted);
      transition: border-color .15s, background .15s;
    }
    .upload.drag { border-color: var(--teal-700); background: var(--lime-wash); }
    .upload.compact { display: flex; align-items: center; gap: 14px; text-align: left; padding: 12px 14px; }
    .upload.compact .ico, .upload.compact svg { width: 22px !important; height: 22px !important; margin: 0; flex: 0 0 22px; }
    .upload.compact .up-copy { flex: 1; min-width: 0; }
    .upload.compact h3 { margin: 0 0 2px; font-size: 14px; }
    .upload.compact p { margin: 0; font-size: 12.5px; }

    .upload h3 { margin: 8px 0 4px; color: var(--ink); font-size: 15px; }
    .rule {
      background: var(--info-bg); border: 1px solid #cfe3df; border-radius: 12px; padding: 14px 16px;
    }
    .rule h3 { margin: 0 0 8px; font-size: 14px; }
    .rule .why { margin: 0; color: var(--muted); }
    .rule dl { display: grid; grid-template-columns: 140px 1fr; gap: 6px 12px; margin: 10px 0 0; }
    .rule dt { color: var(--faint); font-size: 12px; }
    .rule dd { margin: 0; font-weight: 650; }
    .notice {
      border-radius: 12px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start;
      font-size: 13px;
    }
    .notice.alert { background: var(--danger-bg); color: #7A1A14; border: 1px solid #f5c2be; }
    .notice.warn { background: var(--warn-bg); color: #7A3E08; border: 1px solid #f3d48a; }
    .notice.info { background: var(--info-bg); color: #134E4A; border: 1px solid #cfe3df; }
    .notice strong { display: block; margin-bottom: 2px; }
    .stage { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; overflow: hidden; background: #fff; }
    .stage.done { border-color: #c9e8d4; }
    .stage-h {
      display: grid; grid-template-columns: 36px 1fr auto auto auto;
      gap: 10px; align-items: center; padding: 12px 14px; cursor: pointer;
    }
    .stage-n {
      width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
      background: var(--teal-900); color: #fff; font-weight: 800; font-size: 12px;
    }
    .stage.done .stage-n { background: var(--ok); }
    .stage.suspended-grant .grant { color: var(--danger); text-decoration: line-through; }
    .stage .ttl { font-weight: 700; }
    .stage .meta { font-size: 12px; color: var(--faint); }
    .money { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
    .grant { font-size: 12px; text-align: right; font-weight: 650; color: var(--ok); }
    .stage-b { display: none; padding: 0 14px 14px 60px; color: var(--muted); font-size: 13px; }
    .stage.open .stage-b { display: block; }
    .totals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 8px; }
    .tot { background: var(--bg); border-radius: 12px; padding: 12px 14px; }
    .tot .k { font-size: 11px; color: var(--muted); font-weight: 600; }
    .tot .v { font-size: 20px; font-weight: 750; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .docs { display: flex; flex-direction: column; gap: 8px; }
    .doc {
      display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; align-items: center;
      border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: #fff;
    }
    .doc .di {
      width: 36px; height: 36px; border-radius: 8px; background: var(--lime-wash);
      display: grid; place-items: center; color: var(--teal-800);
    }
    .doc .dt { font-weight: 700; }
    .doc .ds { font-size: 12px; color: var(--faint); }
    .badge {
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em;
      padding: 2px 7px; border-radius: 999px; background: var(--lime-wash); color: var(--teal-800);
    }
    .badge.queue { background: var(--warn-bg); color: var(--warn); }
    .badge.missing { background: var(--danger-bg); color: var(--danger); }
    .check { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .check:last-child { border-bottom: 0; }
    .check input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--teal-700); }
    .check.done .ct { text-decoration: line-through; color: var(--faint); }
    .progress { height: 8px; background: #e6ecea; border-radius: 99px; overflow: hidden; }
    .progress > span { display: block; height: 100%; background: linear-gradient(90deg, var(--teal-700), var(--lime)); }
    .log { font-family: var(--mono); font-size: 11.5px; line-height: 1.55; }
    .log-row { display: grid; grid-template-columns: 52px 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
    .log-row:last-child { border-bottom: 0; }
    .log .idx { color: var(--teal-700); font-weight: 700; }
    .log .hash { color: #0F3D3A; word-break: break-all; }
    .log .prev { color: var(--faint); }
    .log .act { font-family: var(--sans); font-size: 12.5px; font-weight: 650; margin-bottom: 2px; color: var(--ink); }
    .log .when { font-family: var(--sans); color: var(--faint); font-size: 12px; }
    .remind { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; padding: 14px 0; border-bottom: 1px solid var(--line); }
    .remind:last-child { border-bottom: 0; }
    .remind.done { opacity: .55; }
    .remind.done .rt { text-decoration: line-through; }
    .rt { font-weight: 700; }
    .rm { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .racts { display: flex; gap: 6px; align-items: flex-start; }
    .toast-wrap {
      position: fixed; right: 18px; bottom: 18px; z-index: 80;
      display: flex; flex-direction: column; gap: 8px;
    }
    .toast {
      background: var(--teal-950); color: #fff; padding: 10px 14px; border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,.2); max-width: 360px; font-size: 13px;
    }
    .modal-back {
      position: fixed; inset: 0; background: rgba(14,47,49,.45); z-index: 70;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .modal {
      background: #fff; border-radius: 16px; width: min(520px, 100%);
      padding: 20px 22px; box-shadow: 0 20px 50px rgba(0,0,0,.2);
    }
    .modal h3 { margin: 0 0 8px; font-size: 17px; }
    .share-box {
      background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
      padding: 10px 12px; font-family: var(--mono); font-size: 12px; word-break: break-all; margin: 10px 0;
    }
    .scrim {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 45;
    }
    .metric-row { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; font-size: 13px; }
    .metric-row + .metric-row { border-top: 1px solid var(--line); }
    .muted { color: var(--muted); }
    .faint { color: var(--faint); }
    .right { text-align: right; }
    .nowrap { white-space: nowrap; }
    .hidden { display: none !important; }
    .icon-btn { border: 0; background: transparent; padding: 4px; color: var(--muted); }
    h2.sec { font-size: 15px; margin: 18px 0 8px; }
    .peb-big { display: flex; align-items: center; gap: 14px; }
    .peb-big .chip { width: 56px; height: 56px; font-size: 26px; border-radius: 12px; min-width: 56px; }
    .peb-big .kwh { font-size: 28px; font-weight: 750; letter-spacing: -.03em; line-height: 1; }
    .peb-big .unit { font-size: 12px; color: var(--faint); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    .fine-note { font-size: 12px; color: var(--muted); margin-top: 8px; }
    @media (max-width: 1100px) {
      .kpis { grid-template-columns: repeat(2, 1fr); }
      .grid-2, .grid-3, .totals, .stage-h { grid-template-columns: 1fr; }
      .stage-h { display: flex; flex-wrap: wrap; }
      .search { display: none; }
      .sidebar {
        position: fixed; left: 0; top: 0; z-index: 50;
        transform: translateX(-105%); transition: transform .2s ease;
      }
      .sidebar.open { transform: none; }
      .menu-btn { display: inline-flex; }
      .scrim.on { display: block; }
    }
    @media (max-width: 720px) {
      main { padding: 16px 14px 40px; }
      .kpis { grid-template-columns: 1fr; }
      .userpill .umeta { display: none; }
    }
    @media print {
      .sidebar, .banner, .topbar, .toast-wrap, .modal-back, .scrim, .no-print, .menu-btn { display: none !important; }
      .workspace { display: block; }
      main { padding: 0; }
      body { background: #fff; }

    const end = new Date(untilIso + "T00:00:00+01:00");
    let days = Math.round((end - now) / 86400000);
    if (days < 0) days = 0;
    const years = Math.floor(days / 365);
    const rem = days - years * 365;
    const months = Math.floor(rem / 30);
    return { days, years, months };
  }

  function formatSpan(untilIso) {
    const { years, months, days } = countdownParts(untilIso);
    const bits = [];
    if (years > 1) bits.push(t("years", { n: years }));
    else if (years === 1) bits.push(t("year1"));
    if (months > 1) bits.push(t("months", { n: months }));
    else if (months === 1) bits.push(t("month1"));
    if (!years && !months) bits.push(t("days", { n: days }));
    return t("countdownIn", { t: bits.join(" · ") });
  }

  function bindUpload() {
    const drop = $("drop");

    if (!drop || !input) return;
    const start = (name) => simulateParse(name);
    $("pickBtn").addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); input.click(); });
    input.addEventListener("change", () => {
      const f = input.files && input.files[0];
      start(f ? f.name : t("demoParsedName"));
    });
    ["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("drag"); }));
    ["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("drag"); }));
    drop.addEventListener("drop", (e) => {
      const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      start(f ? f.name : t("demoParsedName"));
    });
  }

        <div class="idx">#${String(e.i).padStart(3, "0")}</div>
        <div>
          <div class="act">${esc(state.lang === "fr" ? e.act_fr : e.act_en)}</div>
          <div class="when">${fmtDateTime(e.at)}</div>
          <div class="hash">${esc(t("hashOf"))} sha256:${esc(e.hash)}</div>
          <div class="prev">${esc(t("prevHash"))} ${esc(e.prev)}</div>
        </div>
      </div>`).join("");

    const progressNote = b.region === "brussels"
      ? (meets2033(b) ? t("alreadyMet") : formatSpan(b.deadline) + " · 1 Jan 2033")
      : t("deadlineNone");

    $("main").innerHTML = `
      <h1>${esc(t("dossierTitle"))}</h1>
      <p class="lede">${esc(b.name)} — ${esc(t("dossierLede"))}</p>
      <div class="actions no-print">
        <button class="btn primary" id="pdfBtn">${esc(t("exportPdf"))}</button>
        <button class="btn" id="shareBtn">${esc(t("shareLink"))}</button>
        <button class="btn" id="agBtn">${esc(t("agVersion"))}</button>
      </div>
      <div class="grid-2" style="margin-bottom:14px">
        <div class="card">
          <div class="card-h"><h2>${esc(t("progressToDeadline"))}</h2>${tag()}</div>
          <div class="card-b">
            <div class="progress" style="height:10px"><span style="width:${pr.pct}%"></span></div>
            <div class="muted" style="margin-top:8px">${esc(t("proofsHeld", { held: pr.held, need: pr.need }))} · ${esc(progressNote)}</div>
            <div class="peb-pair">
              <div>
                <div class="unit">${esc(t("evBefore"))}</div>
                <div class="peb-big" style="margin-top:6px"><span class="chip ${b.label}">${b.label}</span><div><div class="kwh" style="font-size:22px">${fmtNum(b.kwh)}</div><div class="unit">kWh/m²/${state.lang === "fr" ? "an" : "yr"}</div></div></div>
              </div>
              <div>
                <div class="unit">${esc(t("evAfter"))}</div>
                <p class="muted" style="margin:8px 0 0">${esc(t("evAfterMissing"))}</p>
              </div>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="card-h"><h2>${esc(t("missingTitle"))}</h2></div>
          <div class="card-b">
            <p class="muted" style="margin:0 0 8px">${esc(t("missingHint"))}</p>
            ${heldHtml}
          </div>
        </div>
      </div>
      <div class="card" style="margin-bottom:14px">
        <div class="card-h"><h2>${esc(t("autoFiled"))}</h2></div>
        <div class="card-b docs">${pack.filed.map(docRow).join("")}</div>
      </div>
      ${pack.queue.length ? `<div class="card" style="margin-bottom:14px">
        <div class="card-h"><h2>${esc(t("reviewQueue"))}</h2></div>
        <div class="card-b"><p class="muted" style="margin:0 0 8px">${esc(t("reviewHint"))}</p><div class="docs">${pack.queue.map(docRow).join("")}</div></div>
      </div>` : ""}
      <div class="card">
        <div class="card-h"><h2>${esc(t("historyTitle"))}</h2></div>
        <div class="card-b">
          <p class="muted" style="margin:0 0 8px">${esc(t("historyHint"))}</p>
          <div class="log">${logHtml}</div>
        </div>
      </div>
      <p class="faint no-print" style="margin-top:18px;font-size:12px">${esc(t("footer"))}</p>`;
  }

  function renderReminders() {
    const upcoming = state.reminders.filter((r) => !r.done).slice().sort(cmpDue);
    const done = state.reminders.filter((r) => r.done);
    const block = (list) => list.length === 0 ? `<div class="empty">${esc(t("noReminders"))}</div>` : list.map(reminderHtml).join("");
    $("main").innerHTML = `
      <h1>${esc(t("remindersTitle"))}</h1>
      <p class="lede">${esc(t("remindersLede"))}</p>
      <div class="card" style="margin-bottom:14px">
        <div class="card-h"><h2>${esc(t("upcoming"))}</h2></div>
        <div class="card-b">${block(upcoming)}</div>
      </div>
      ${done.length ? `<div class="card"><div class="card-h"><h2>${esc(t("doneSection"))}</h2></div><div class="card-b">${block(done)}</div></div>` : ""}
      <p class="faint" style="margin-top:18px;font-size:12px">${esc(t("footer"))}</p>`;
  }

  function cmpDue(a, b) {
    const da = a.snooze || a.due;
    const db = b.snooze || b.due;
    return da < db ? -1 : da > db ? 1 : 0;
  }

  function reminderHtml(r) {
    const b = getBuilding(r.building);
    const due = r.snooze || r.due;
    const snoozeNote = r.snooze ? ` · ${t("snoozedUntil", { d: fmtDate(r.snooze) })}` : "";
    return `<div class="remind ${r.done ? "done" : ""}">
      <div>
        <div class="rt">${esc(state.lang === "fr" ? r.fr : r.en)}</div>
        <div class="rm">
          <button class="icon-btn" style="padding:0;color:var(--teal-700);font-weight:700" data-go="building" data-id="${esc(b.id)}">${esc(b.name)}</button>
          · ${esc(t(r.rec))} · ${esc(t(r.ch))}
          · ${esc(t("dueOn", { d: fmtDate(due) }))}${esc(snoozeNote)} ${tag()}
        </div>
      </div>
      <div class="racts no-print">
        ${r.done ? "" : `<button class="btn" data-snooze="${esc(r.id)}">${esc(r.snooze ? t("unsnooze") : t("snooze"))}</button>`}
        ${r.done ? "" : `<button class="btn primary" data-done="${esc(r.id)}">${esc(t("markDone"))}</button>`}
      </div>
    </div>`;
  }

  function toast(msg) {
    const wrap = $("toasts");
    const n = document.createElement("div");
    n.className = "toast";
    n.textContent = msg;
    wrap.appendChild(n);
    setTimeout(() => { n.remove(); }, 3200);
  }

  function openShareModal() {
    const b = getBuilding(state.buildingId);
    const exp = new Date();
    exp.setDate(exp.getDate() + 14);
    const expStr = exp.toISOString().slice(0, 10);
    const link = "https://app.renopath.example/share/" + b.id + "-8f3a?exp=" + expStr;
    $("modal-root").innerHTML = `
      <div class="modal-back" id="modalBack">
        <div class="modal" role="dialog" aria-modal="true">
          <h3>${esc(t("shareTitle"))}</h3>
          <p class="muted">${esc(t("shareBody"))}</p>
          <div class="share-box" id="shareVal">${esc(link)}</div>
          <p class="muted">${esc(t("shareExpires", { d: fmtDate(expStr) }))} ${tag()}</p>
          <div class="actions">
            <button class="btn primary" id="copyShare">${esc(t("copyLink"))}</button>
            <button class="btn" id="closeShare">${esc(t("close"))}</button>
          </div>
        </div>
      </div>`;
    const close = () => { $("modal-root").innerHTML = ""; };
    $("closeShare").onclick = close;
    $("modalBack").addEventListener("click", (e) => { if (e.target.id === "modalBack") close(); });
    $("copyShare").onclick = () => {
      const val = link;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(val).catch(() => {});
      }
      toast(t("copied"));
    };
  }

  function addDays(iso, n) {
    const d = new Date(iso + "T12:00:00+01:00");
    d.setDate(d.getDate() + n);
    return d.toISOString().slice(0, 10);
  }

  function bindMainEvents() {
    const main = $("main");
    main.querySelectorAll("[data-open]").forEach((tr) => {
      tr.addEventListener("click", () => go("building", tr.getAttribute("data-open")));
    });
    main.querySelectorAll("[data-filter]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const g = btn.getAttribute("data-filter");
        const v = btn.getAttribute("data-val");
        if (g === "region") state.region = v;
        if (g === "status") state.status = v;
        render();
      });
    });
    main.querySelectorAll("[data-go]").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        go(btn.getAttribute("data-go"), btn.getAttribute("data-id") || state.buildingId);
      });
    });
    main.querySelectorAll(".stage-h").forEach((h) => {
      h.addEventListener("click", () => h.parentElement.classList.toggle("open"));
    });
    const sharePlan = $("sharePlanBtn");
    if (sharePlan) sharePlan.addEventListener("click", () => toast(t("planShared")));
    const pdfBtn = $("pdfBtn");
    if (pdfBtn) pdfBtn.addEventListener("click", () => { toast(t("exportToast")); setTimeout(() => window.print(), 250); });
    const shareBtn = $("shareBtn");
    if (shareBtn) shareBtn.addEventListener("click", openShareModal);
    const agBtn = $("agBtn");
    if (agBtn) agBtn.addEventListener("click", () => toast(t("agToast")));
    main.querySelectorAll("[data-check]").forEach((box) => {
      box.addEventListener("change", () => {
        const [bid, cid] = box.getAttribute("data-check").split(":");
        const list = state.checks[bid] || [];
        const item = list.find((c) => c.id === cid);
        if (item) item.done = box.checked;
        render();
      });
    });
    main.querySelectorAll("[data-done]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const r = state.reminders.find((x) => x.id === btn.getAttribute("data-done"));
        if (r) { r.done = true; toast(t("markedDone")); render(); }
      });
    });
    main.querySelectorAll("[data-snooze]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const r = state.reminders.find((x) => x.id === btn.getAttribute("data-snooze"));
        if (!r) return;
        if (r.snooze) r.snooze = null;
        else r.snooze = addDays(r.due, 7);
        toast(t("reminderSnoozed"));
        render();
      });
    });
  }

  /* Fix search rebind: use a named handler stored on state */
  function bindSearch() {
    const q = $("q");
    if (!q) return;
    q.oninput = () => {
      state.query = q.value;
      if (state.view !== "portfolio") {
        state.view = "portfolio";
        history.pushState(null, "", "#/portfolio");
      }
      const caret = q.selectionStart;
      renderPortfolio();
      bindMainEvents();
      renderTopbar();
      const nq = $("q");
      if (nq) {
        nq.value = state.query;
        nq.focus();
        try { nq.setSelectionRange(caret, caret); } catch (e) {}
        bindSearch();
      }
    };
  }

  function render() {
    parseHash();
    renderSidebar();
    renderBanner();
    renderTopbar();
    if (state.view === "portfolio") renderPortfolio();
    else if (state.view === "plan") renderPlan();
    else if (state.view === "dossier") renderDossier();
    else if (state.view === "reminders") renderReminders();
    else renderBuilding();
    bindMainEvents();
    bindSearch();
    const menu = $("menuBtn");
    if (menu) menu.onclick = () => { state.sidebarOpen = !state.sidebarOpen; renderSidebar(); };
    $("scrim").onclick = () => { state.sidebarOpen = false; renderSidebar(); };
    $("sidebar").querySelectorAll("[data-go]").forEach((btn) => {
      btn.onclick = () => go(btn.getAttribute("data-go"), state.buildingId);
    });
    $("sidebar").querySelectorAll("[data-lang]").forEach((btn) => {
      btn.onclick = () => setLang(btn.getAttribute("data-lang"));
    });
  };

  try {
    const saved = localStorage.getItem("renopath-lang-v2");
    if (saved === "en" || saved === "fr") state.lang = saved;
  } catch (e) {}
  const params = new URLSearchParams(location.search);
  if (params.get("lang") === "en" || params.get("lang") === "fr") state.lang = params.get("lang");

  window.addEventListener("hashchange", () => render());
  window.addEventListener("popstate", () => render());
  if (!location.hash) history.replaceState(null, "", "#/portfolio");
  document.documentElement.lang = state.lang;
  document.title = t("title");
  render();
})();
</script>
</body>
</html>
